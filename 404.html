  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#0d3048 0,#071724 36%,#040c13 100%);color:#eefbff}

    h1{margin:8px 0 10px;font-size:clamp(1.45rem,6vw,2rem)}
    p{margin:0 auto 24px;max-width:40ch;color:#a9bfd0;line-height:1.55}
    .actions{display:grid;gap:10px}
    a{display:flex;min-height:46px;align-items:center;justify-content:center;border-radius:14px;padding:10px 16px;text-decoration:none;font-weight:750}
    .primary{background:#7eeeff;color:#04131d}
    .secondary{border:1px solid rgba(126,238,255,.32);color:#dffaff;background:rgba(126,238,255,.06)}
    a:focus-visible{outline:3px solid #fff;outline-offset:3px}
    small{display:block;margin-top:20px;color:#6f8a9b}

  <main>

      <a class="secondary" href="https://wa.me/59177057379">Contactar soporte</a>

</body>
