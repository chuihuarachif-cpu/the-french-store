name: R131 Player ID and Legal Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/player-verify.js'
      - 'v2/legal-account.js'
      - 'v2/buy-now.js'
      - 'v2/index.html'
      - '.github/workflows/r41-player-verify-legal-safety.yml'
  push:
    branches: [main]
    paths:
      - 'v2/player-verify.js'
      - 'v2/legal-account.js'
      - 'v2/buy-now.js'
      - 'v2/index.html'
      - '.github/workflows/r41-player-verify-legal-safety.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check v2/player-verify.js
          node --check v2/legal-account.js
          node --check v2/buy-now.js
      - name: Player ID capture is provider-independent and manual-safe
        run: |
          set -euo pipefail
          grep -Fq 'player-id-only-v1-20260831-r131' v2/player-verify.js
          grep -Fq "sb.from('checkout_input_requirements')" v2/player-verify.js
          grep -Fq 'state.entered' v2/player-verify.js
          grep -Fq 'rememberEntered' v2/player-verify.js
          grep -Fq 'syncCartInputs' v2/player-verify.js
          grep -Fq 'fs:player-input-change' v2/player-verify.js
          grep -Fq 'Ingresa tu ID de jugador' v2/player-verify.js
          grep -Fq 'No te pediremos contraseña' v2/player-verify.js
          ! grep -Fq '/api/player-verify' v2/player-verify.js
          ! grep -Fq 'Verificar nombre' v2/player-verify.js
          ! grep -Eqi 'service_role|GAMERHUB_API|GAMERHUB_SECRET|api_secret|precio_proveedor|price_usd|create.?provider.?order|provider_purchase_jobs' v2/player-verify.js
      - name: Legal acceptance is account-level, not cart-level
        run: |
          set -euo pipefail
          grep -Fq 'id="legalAccept"' v2/index.html
          ! grep -Fq 'id="purchaseLegalAccept"' v2/index.html
          grep -Fq 'fs_terms_accepted' v2/legal-account.js
          grep -Fq 'fs_privacy_accepted' v2/legal-account.js
          grep -Fq 'fs_legal_accepted_at' v2/legal-account.js
      - name: Both purchase actions remain
        run: |
          set -euo pipefail
          grep -Fq 'Comprar ahora' v2/buy-now.js
          grep -Fq 'Añadir al carrito' v2/buy-now.js
          grep -Fq "openModal('cartModal')" v2/buy-now.js
          grep -Fq 'id="checkoutWallet"' v2/index.html
          grep -Fq 'id="checkoutQR"' v2/index.html
