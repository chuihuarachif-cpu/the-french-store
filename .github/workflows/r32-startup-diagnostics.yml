name: R32 Startup Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/r32-startup-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Validate R32 source contracts
        run: |
          node --check v2/r7fix.js
          node --check v2/runtime-health.js
          grep -q "FSStartupDiagnostics" v2/r7fix.js
          grep -q "wrapStartupRender" v2/r7fix.js
          grep -q "renderCategoryTabs.*renderCatalog.*renderFeatured.*renderCart" v2/r7fix.js
          grep -q "unhandledrejection" v2/runtime-health.js
          grep -q "featured.children.length === 0" v2/runtime-health.js
          grep -q "catalog.children.length === 0" v2/runtime-health.js
          grep -q "runtime-health.js?v=20260820-2338" v2/index.html
          grep -q "r7fix.js?v=20260820-2338" v2/index.html

      - name: Verify live public catalog has data
        shell: bash
        run: |
          URL=$(sed -n "s/^const SUPABASE_URL='\([^']*\)'.*/\1/p" v2/app.js)
          KEY=$(sed -n "s/^const SUPABASE_KEY='\([^']*\)'.*/\1/p" v2/app.js)
          test -n "$URL" && test -n "$KEY"
          curl --fail --retry 3 --retry-delay 2 -sS \
            "$URL/rest/v1/productos?select=id,juego,paquete,categoria,precio,activo&activo=eq.true&order=juego.asc,precio.asc" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -o /tmp/r32-products.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/r32-products.json','utf8'));
          if(!Array.isArray(rows) || rows.length < 1) throw new Error('Public catalog returned no active products');
          const required=['id','juego','paquete','categoria','precio','activo'];
          for(const key of required){ if(!(key in rows[0])) throw new Error(`Missing catalog field ${key}`); }
          console.log(`R32 catalog fixture: ${rows.length} active products`);
          NODE

      - name: Start local storefront preview
        run: |
          python3 -m http.server 8080 > /tmp/r32-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/v2/vendor/supabase-2.112.3.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/app.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/r6.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/r7fix.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/runtime-health.js >/dev/null

      - name: Build exact startup-order browser harness
        run: |
          cat > v2/__r32-probe.js <<'JS'
          (()=>{
            const byId=id=>document.getElementById(id);
            addEventListener('DOMContentLoaded',()=>{
              setTimeout(()=>{
                const before={
                  inventoryLen: typeof inventory!=='undefined'?inventory.length:-1,
                  featured: byId('featuredList')?.children.length||0,
                  catalog: byId('catalogList')?.children.length||0,
                  health: window.FSRuntimeHealth?.state||'missing',
                  errors: window.FSStartupDiagnostics?.errors?.length||0
                };

                const oldLogo=logoUrl;
                logoUrl=()=>{ throw new Error('R32_FORCED_CATALOG_FAILURE'); };
                try{ renderCatalog(); }finally{ logoUrl=oldLogo; }
                renderFeatured();

                const failureCaptured=(window.FSStartupDiagnostics?.errors||[]).some(e=>e.stage==='renderCatalog'&&/R32_FORCED_CATALOG_FAILURE/.test(e.message||''));
                const featuredRecovered=(byId('featuredList')?.children.length||0)>0;
                document.querySelector('[data-nav="tienda"]')?.click();
                const navOk=byId('view-tienda')?.classList.contains('active')===true;

                Promise.reject(new Error('R32_LATE_REJECTION_TEST'));
                setTimeout(()=>{
                  const rejectionCaptured=(window.FSStartupDiagnostics?.errors||[]).some(e=>e.stage==='UNHANDLED_REJECTION'&&/R32_LATE_REJECTION_TEST/.test(e.message||''));
                  const lateHealth=window.FSRuntimeHealth?.state||'missing';
                  const pass=before.inventoryLen>0&&before.featured>0&&before.catalog>0&&failureCaptured&&featuredRecovered&&navOk&&rejectionCaptured&&lateHealth!=='degraded';
                  byId('r32Result').textContent=(pass?'R32_STARTUP_PASS ':'R32_STARTUP_FAIL ')+JSON.stringify({before,failureCaptured,featuredRecovered,navOk,rejectionCaptured,lateHealth,diag:window.FSStartupDiagnostics});
                },150);
              },4500);
            },{once:true});
          })();
          JS

          cat > v2/__r32-startup.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8">
          <script src="./vendor/supabase-2.112.3.js"></script>
          <script src="./runtime-health.js" defer></script>
          <script src="./app.js" defer></script>
          <script src="./r6.js" defer></script>
          <script src="./r7fix.js" defer></script>
          <script src="./__r32-probe.js" defer></script>
          </head><body>
          <button id="authButton"></button><button id="cartButton"></button><span id="cartCount"></span>
          <button id="cartInline"></button><span id="cartInlineCount"></span>
          <button id="whatsappQuote"></button><button id="floatingWhatsapp"></button>
          <nav><button data-nav="inicio">Inicio</button><button data-nav="tienda">Tienda</button><button data-nav="wallet">Wallet</button><button data-nav="pedidos">Pedidos</button><button data-nav="perfil">Perfil</button></nav>
          <button data-category="Recargas por ID"></button><button data-category="Recargas por Cuenta"></button><button data-category="Streaming"></button><button data-category="Gift Cards"></button>
          <section id="view-inicio" class="view active"><div id="featuredList"></div></section>
          <section id="view-tienda" class="view"><span id="categoryEyebrow"></span><span id="catalogMeta">Cargando productos…</span><div id="categoryTabs"></div><div id="catalogList"></div></section>
          <section id="view-wallet" class="view"></section><section id="view-pedidos" class="view"><div id="ordersList"></div></section><section id="view-perfil" class="view"></section><section id="view-admin" class="view"><div id="adminContent"></div></section>
          <div id="authModal" class="modal"><button data-close="authModal"></button><input id="loginEmail"><input id="loginPassword"><button id="loginSubmit">Entrar</button><div id="loginMessage"></div></div>
          <div id="cartModal" class="modal"><button data-close="cartModal"></button><div id="cartItems"></div><span id="cartTotal"></span></div>
          <div id="qrModal" class="modal"><button data-close="qrModal"></button><span id="qrOrderCode"></span><span id="qrOrderTotal"></span><button id="qrWhatsapp"></button></div>
          <div id="topupQrModal" class="modal"><button data-close="topupQrModal"></button><span id="topupQrAmount"></span><span id="topupQrReference"></span></div>
          <span id="walletBalance"></span><span id="walletStatus"></span><div id="topupHistory"></div><div id="walletHistory"></div><input id="topupAmount"><div id="topupResult"></div>
          <button id="requestTopup"></button><button id="cancelTopupRequest"></button><button id="refreshWallet"></button><button id="refreshOrders"></button><button id="checkoutWallet"></button><button id="checkoutQR"></button>
          <span id="profileName"></span><span id="profileEmail"></span><button id="logoutButton"></button><button id="openAdmin"></button><button id="refreshAdmin"></button><button data-admin-tab="topups"></button>
          <pre id="r32Result">R32_WAIT</pre>
          </body></html>
          HTML

      - name: Browser-test real catalog plus forced render failure recovery
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME"
          timeout 30s "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=8000 --dump-dom \
            http://127.0.0.1:8080/v2/__r32-startup.html > /tmp/r32-startup-dom.txt
          grep -q "R32_STARTUP_PASS" /tmp/r32-startup-dom.txt || { cat /tmp/r32-startup-dom.txt; exit 1; }
          grep "R32_STARTUP_PASS" /tmp/r32-startup-dom.txt

      - name: Clean temporary harness
        if: always()
        run: rm -f v2/__r32-probe.js v2/__r32-startup.html
