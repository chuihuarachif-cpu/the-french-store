name: Release simplified auth

on:
  push:
    paths:
      - .github/workflows/auth-ease-release.yml

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch auth loading and confirmation copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('v2/index.html')
          text = index.read_text(encoding='utf-8')
          marker = '  <script src="./legal.js" defer></script>'
          insert = '  <script src="./auth-ease.js" defer></script>\n' + marker
          if './auth-ease.js' not in text:
              if marker not in text:
                  raise SystemExit('legal.js script marker not found')
              text = text.replace(marker, insert, 1)
              index.write_text(text, encoding='utf-8')

          confirm = Path('v2/auth-confirm.js')
          c = confirm.read_text(encoding='utf-8')
          c = c.replace("        : 'Por seguridad, el enlace no confirma nada automáticamente. Pulsa el botón para confirmar que eres tú.'}",
                        "        : 'Último paso: pulsa el botón para confirmar tu correo y entrar automáticamente a FRENCH STORE.'}")
          c = c.replace("        : 'Confirmar mi correo'}</button>", "        : 'Confirmar y entrar'}</button>")
          c = c.replace("button.textContent = kind === 'recovery' ? 'Continuar recuperación' : 'Confirmar mi correo';",
                        "button.textContent = kind === 'recovery' ? 'Continuar recuperación' : 'Confirmar y entrar';")
          confirm.write_text(c, encoding='utf-8')
          PY

      - name: Validate JavaScript and auth order
        run: |
          node --check v2/auth-ease.js
          node --check v2/legal.js
          node --check v2/auth-confirm.js
          python3 - <<'PY'
          from pathlib import Path
          t=Path('v2/index.html').read_text(encoding='utf-8')
          assert t.count('./auth-ease.js') == 1
          assert t.index('./auth-ease.js') < t.index('./legal.js') < t.index('./auth-confirm.js')
          assert 'https://frenchstorebo.com/v2/' in Path('v2/auth-ease.js').read_text(encoding='utf-8')
          print('Auth checks OK')
          PY

      - name: Commit release
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/index.html v2/auth-confirm.js
          git commit -m "Polish email confirmation flow"
          git push origin main
