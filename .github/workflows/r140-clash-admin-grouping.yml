name: R140 Clash/Admin Grouping Safety

on:
  pull_request:
    paths:
      - 'admin/r138-account-cost-editor.js'
      - 'admin/index.html'
      - '.github/workflows/r140-clash-admin-grouping.yml'
  push:
    branches: [main]
    paths:
      - 'admin/r138-account-cost-editor.js'
      - 'admin/index.html'
      - '.github/workflows/r140-clash-admin-grouping.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check grouped Admin price editor
        run: |
          set -euo pipefail
          node --check admin/r138-account-cost-editor.js
          grep -q 'data-r140-open-game' admin/r138-account-cost-editor.js
          grep -q 'data-r140-back' admin/r138-account-cost-editor.js
          grep -q 'admin_app_update_account_purchase_cost' admin/r138-account-cost-editor.js
          grep -q 'admin_app_set_fixed_price' admin/r138-account-cost-editor.js
          grep -q 'admin_app_is_allowed' admin/r138-account-cost-editor.js
          grep -q 'BINANCE_P2P' admin/r138-account-cost-editor.js
          ! grep -qi 'service_role' admin/r138-account-cost-editor.js
