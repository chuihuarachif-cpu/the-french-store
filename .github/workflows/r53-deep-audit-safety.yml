name: R53 Deep Audit Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/bootstrap.js'
      - 'v2/core/ui.js'
      - 'v2/admin-streaming-prices.js'
      - 'v2/index.html'
      - '.github/workflows/r53-deep-audit-safety.yml'
  push:
    branches: [main]
    paths:
      - 'v2/bootstrap.js'
      - 'v2/core/ui.js'
      - 'v2/admin-streaming-prices.js'
      - 'v2/index.html'
      - '.github/workflows/r53-deep-audit-safety.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check v2/bootstrap.js
          node --check v2/core/ui.js
          node --check v2/admin-streaming-prices.js

      - name: Orders first tap must remain immediate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('v2/bootstrap.js').read_text()
          start=s.index("if (target.dataset.nav === 'pedidos')")
          end=s.index("if (target.id === 'refreshOrders'", start)
          block=s[start:end]
          assert "ensureFeature('orders').catch" in block
          assert 'preventDefault' not in block
          assert 'stopImmediatePropagation' not in block
          PY

      - name: Streaming admin save is server authoritative and resilient
        run: |
          set -euo pipefail
          grep -Fq "admin_update_streaming_price_v2" v2/admin-streaming-prices.js
          grep -Fq "admin_update_streaming_price'" v2/admin-streaming-prices.js
          grep -Fq "data-streaming-product" v2/admin-streaming-prices.js
          grep -Fq "PGRST202" v2/admin-streaming-prices.js
          grep -Fq "Los pedidos nuevos ya usarán este valor" v2/admin-streaming-prices.js
          ! grep -q "from('productos').update\|from(\"productos\").update" v2/admin-streaming-prices.js

      - name: Public auth remains Google-only
        run: |
          set -euo pipefail
          grep -Fq "function addSignupButton(){ return null }" v2/core/ui.js
          grep -Fq "Continúa con Google para acceder a FRENCH STORE" v2/index.html
          # R160: antes se exigía que los campos de correo y contraseña
          # EXISTIERAN ocultos. Ahora se exige que NO EXISTAN, que es una
          # garantía estrictamente más fuerte de "solo Google": un campo
          # ausente no puede reaparecer al quitarle una clase, ni lo ve el
          # gestor de contraseñas del navegador.
          ! grep -Fq 'id="loginEmail"' v2/index.html
          ! grep -Fq 'id="loginPassword"' v2/index.html
          ! grep -Eq '<input[^>]*type="password"' v2/index.html
          ! grep -Fq 'sb.auth.signUp(' v2/legal.js
          grep -Fq 'id="loginSubmit" class="primary-btn full hidden"' v2/index.html
          ! grep -Fq "respaldo para cuentas existentes y administración" v2/index.html

      - name: Cache bust and secret hygiene
        run: |
          set -euo pipefail
          grep -Eq "const VERSION = 'r[0-9]+-" v2/bootstrap.js
          grep -Fq "admin-streaming-prices.js?v=20260826-r57" v2/bootstrap.js
          node scripts/test-bootstrap-release.mjs
          ! grep -Eqi "service_role|SUPABASE_SERVICE|client_secret|private[_-]?key|provider_token" v2/bootstrap.js v2/core/ui.js v2/admin-streaming-prices.js v2/index.html
