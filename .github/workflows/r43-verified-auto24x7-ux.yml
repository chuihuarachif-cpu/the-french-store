name: Manual Fulfillment and ID Only Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/automation-capabilities.js'
      - 'v2/automatic-order-ui.js'
      - 'v2/paid-whatsapp.js'
      - 'v2/player-verify.js'
      - 'v2/detail-layout-v2.js'
      - 'v2/bootstrap.js'
      - 'v2/index.html'
      - '.github/workflows/r43-verified-auto24x7-ux.yml'
  push:
    branches: [main]
    paths:
      - 'v2/automation-capabilities.js'
      - 'v2/automatic-order-ui.js'
      - 'v2/paid-whatsapp.js'
      - 'v2/player-verify.js'
      - 'v2/detail-layout-v2.js'
      - 'v2/bootstrap.js'
      - 'v2/index.html'
      - '.github/workflows/r43-verified-auto24x7-ux.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check v2/automation-capabilities.js
          node --check v2/automatic-order-ui.js
          node --check v2/paid-whatsapp.js
          node --check v2/player-verify.js
          node --check v2/detail-layout-v2.js
          node --check v2/bootstrap.js

      - name: ID only contract
        run: |
          set -euo pipefail
          grep -Fq 'enteredForGame' v2/player-verify.js
          grep -Fq 'rememberEntered' v2/player-verify.js
          grep -Fq 'syncCartInputs' v2/player-verify.js
          grep -Fq 'function enteredValid(game)' v2/detail-layout-v2.js
          grep -Fq 'const ready=enteredValid(game)' v2/detail-layout-v2.js
          grep -Fq '✓ Datos completos · paquetes habilitados' v2/detail-layout-v2.js
          if grep -Fq '/api/player-verify' v2/player-verify.js; then exit 1; fi
          if grep -Fq 'Verificar nombre' v2/player-verify.js; then exit 1; fi

      - name: Current fulfillment is manual and makes no capability request
        run: |
          set -euo pipefail
          grep -Fq "version: 'manual-fulfillment-20260913'" v2/automation-capabilities.js
          grep -Fq 'automatic: false' v2/automation-capabilities.js
          grep -Fq 'isAutomatic: () => false' v2/automation-capabilities.js
          if grep -Fq 'api.frenchstorebo.com' v2/automation-capabilities.js; then exit 1; fi
          if grep -Fq 'fetch(' v2/automation-capabilities.js; then exit 1; fi

      - name: Manual paid flow remains available
        run: |
          set -euo pipefail
          grep -Fq '✅ Pagado el pedido' v2/paid-whatsapp.js
          grep -Fq 'Avisar pedido pagado por WhatsApp' v2/paid-whatsapp.js

      - name: Customer modules cannot expose privileged backend material
        run: |
          set -euo pipefail
          if grep -Eqi 'service[_ -]?role|SUPABASE_SERVICE|api[_ -]?secret|provider_product_code|provider_sku_code|precio_proveedor|price_usd|create.?provider.?order|POST /v1/orders' \
            v2/automation-capabilities.js v2/automatic-order-ui.js v2/paid-whatsapp.js v2/player-verify.js v2/detail-layout-v2.js; then exit 1; fi

      - name: Checkout keeps safe decorator order
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('v2/bootstrap.js').read_text()
          assert text.index('./automation-capabilities.js') < text.index('./bisa-checkout.js')
          assert text.index('./bisa-checkout.js') < text.index('./fulfillment-inputs.js')
          assert text.index('./fulfillment-inputs.js') < text.index('./automatic-order-ui.js')
          PY
          node scripts/test-bootstrap-release.mjs
