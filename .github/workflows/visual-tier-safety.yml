name: Visual Tier Safety

on:
  pull_request:
    paths:
      - 'v2/tiers/**'
      - 'scripts/test-r167-tier-frames.mjs'
      - '.github/workflows/visual-tier-safety.yml'
  push:
    branches: [main]
    paths:
      - 'v2/tiers/**'
      - 'scripts/test-r167-tier-frames.mjs'
      - '.github/workflows/visual-tier-safety.yml'

permissions:
  contents: read

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Obsidian Prism visual contract
        run: node scripts/test-r167-tier-frames.mjs

      - name: CSS structural and secret safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('v2/tiers/tier-base.css'),
              Path('v2/tiers/tier-gold.css'),
              Path('v2/tiers/tier-diamond.css'),
          ]
          forbidden = ['service_role', 'GAMERHUB_API_KEY', 'GAMERHUB_API_SECRET', 'OPENAI_API_KEY', 'GEMINI_API_KEY']
          for path in files:
              text = path.read_text(encoding='utf-8')
              assert text.count('{') == text.count('}'), f'Unbalanced CSS braces in {path}'
              found = [token for token in forbidden if token in text]
              assert not found, f'Forbidden secret-domain tokens in {path}: {found}'
              assert len(text.encode('utf-8')) < 60000, f'{path} grew beyond the mobile presentation budget'
          print('Tier CSS structure and secret checks OK')
          PY
