name: Visual Tier Safety

on:
  pull_request:
    paths:
      - 'v2/index.html'
      - 'v2/tiers/**'
      - 'v2/assets/brand/unified-hero-diamond-r4.svg'
      - 'v2/premium-release.js'
      - 'scripts/test-r167-tier-frames.mjs'
      - '.github/workflows/visual-tier-safety.yml'
  push:
    branches: [main]
    paths:
      - 'v2/index.html'
      - 'v2/tiers/**'
      - 'v2/assets/brand/unified-hero-diamond-r4.svg'
      - 'v2/premium-release.js'
      - 'scripts/test-r167-tier-frames.mjs'
      - '.github/workflows/visual-tier-safety.yml'

permissions:
  contents: read

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unified blue visual contract
        run: node scripts/test-r167-tier-frames.mjs

      - name: Presentation JavaScript syntax
        run: |
          node --check v2/tiers/tier-gate.js
          node --check v2/tiers/world-ui.js
          node --check v2/premium-release.js
          node --check scripts/test-r167-tier-frames.mjs
          grep -q 'tier-gate-unified-ui-v1-20260917' v2/tiers/tier-gate.js
          grep -q 'unified-blue-r3-20260917' v2/tiers/world-ui.js
          grep -q 'unified-blue-mobile-fix.css' v2/tiers/world-ui.js
          grep -q 'layer(fs-world)' v2/tiers/world-ui.js
          grep -q 'data-fs-interface="unified-blue"' v2/index.html
          grep -q 'world-ui.js?v=20260917-r4' v2/index.html
          grep -q 'premium-release.js?v=20260917-unified-retired-r4' v2/index.html
          grep -q 'unified-blue-reference-r4.css?v=20260917-r4' v2/index.html
          grep -q 'unified-blue-diamond-r5.css?v=20260917-r5' v2/index.html

      - name: CSS structural and secret safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('v2/tiers/tier-base.css'),
              Path('v2/tiers/unified-blue.css'),
              Path('v2/tiers/unified-blue-mobile-fix.css'),
              Path('v2/tiers/unified-blue-reference-r4.css'),
              Path('v2/tiers/unified-blue-diamond-r5.css'),
          ]
          forbidden = ['service_role', 'GAMERHUB_API_KEY', 'GAMERHUB_API_SECRET', 'OPENAI_API_KEY', 'GEMINI_API_KEY']
          for path in files:
              text = path.read_text(encoding='utf-8')
              assert text.count('{') == text.count('}'), f'Unbalanced CSS braces in {path}'
              found = [token for token in forbidden if token in text]
              assert not found, f'Forbidden secret-domain tokens in {path}: {found}'
              if path.name == 'unified-blue-diamond-r5.css':
                  budget = 10000
              elif path.name in ('unified-blue-mobile-fix.css','unified-blue-reference-r4.css'):
                  budget = 30000
              else:
                  budget = 80000
              assert len(text.encode('utf-8')) < budget, f'{path} grew beyond the presentation budget'
          print('Unified CSS structure and secret checks OK')
          PY
