name: Visual Interface Safety

on:
  pull_request:
    paths:
      - 'v2/index.html'
      - 'v2/bootstrap.js'
      - 'v2/tiers/owner-classic-r7.*'
      - 'scripts/test-r167-tier-frames.mjs'
      - '.github/workflows/visual-tier-safety.yml'
  push:
    branches: [main]
    paths:
      - 'v2/index.html'
      - 'v2/bootstrap.js'
      - 'v2/tiers/owner-classic-r7.*'
      - 'scripts/test-r167-tier-frames.mjs'
      - '.github/workflows/visual-tier-safety.yml'

permissions:
  contents: read

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Single Classic interface contract
        run: node scripts/test-r167-tier-frames.mjs
      - name: Presentation JavaScript syntax
        run: |
          node --check v2/tiers/owner-classic-r7.js
          node --check v2/bootstrap.js
          node --check scripts/test-r167-tier-frames.mjs
      - name: CSS and secret safety
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v2/tiers/owner-classic-r7.css')
          text=p.read_text(encoding='utf-8')
          assert text.count('{')==text.count('}'), 'Unbalanced CSS braces'
          for token in ['service_role','GAMERHUB_API_KEY','GAMERHUB_API_SECRET','OPENAI_API_KEY','GEMINI_API_KEY']:
              assert token not in text, f'Forbidden token: {token}'
          assert len(text.encode('utf-8'))<90000, 'Classic CSS exceeded presentation budget'
          print('Classic CSS checks OK')
          PY
