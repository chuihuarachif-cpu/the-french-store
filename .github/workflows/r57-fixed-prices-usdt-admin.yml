name: R57 Fixed Prices and USDT Admin

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/index.html'
      - 'v2/bootstrap.js'
      - 'v2/admin-streaming-prices.js'
      - 'v2/admin-gamerhub-wallet.js'
      - '.github/workflows/r57-fixed-prices-usdt-admin.yml'
  push:
    branches: [main]
    paths:
      - 'v2/index.html'
      - 'v2/bootstrap.js'
      - 'v2/admin-streaming-prices.js'
      - 'v2/admin-gamerhub-wallet.js'
      - '.github/workflows/r57-fixed-prices-usdt-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check v2/bootstrap.js
          node --check v2/admin-streaming-prices.js
          node --check v2/admin-gamerhub-wallet.js

      - name: Validate fresh Admin module versions
        run: |
          set -euo pipefail
          grep -Fq './bootstrap.js?v=20260826-r57' v2/index.html
          grep -Fq './admin-streaming-prices.js?v=20260826-r57' v2/bootstrap.js
          grep -Fq './admin-gamerhub-wallet.js?v=20260826-r57' v2/bootstrap.js

      - name: Validate Streaming fixed-price save contract
        run: |
          set -euo pipefail
          grep -Fq "admin_update_streaming_price_v2" v2/admin-streaming-prices.js
          grep -Fq "admin_update_streaming_price'" v2/admin-streaming-prices.js
          grep -Fq "data-streaming-price-input" v2/admin-streaming-prices.js
          grep -Fq "data-streaming-price-save" v2/admin-streaming-prices.js
          grep -Fq "categoria', 'Streaming'" v2/admin-streaming-prices.js
          ! grep -Fq 'CSS.escape' v2/admin-streaming-prices.js

      - name: Validate GamerHub inventory UX
        run: |
          set -euo pipefail
          grep -Fq 'Auto consumo activo' v2/admin-gamerhub-wallet.js
          grep -Fq 'Cada compra GamerHub que termine SUCCEEDED descuenta automáticamente' v2/admin-gamerhub-wallet.js
          grep -Fq "admin_gamerhub_wallet_add" v2/admin-gamerhub-wallet.js
          grep -Fq "admin_gamerhub_wallet_consume" v2/admin-gamerhub-wallet.js
          grep -Fq 'Ajuste manual excepcional' v2/admin-gamerhub-wallet.js

      - name: Validate no private credentials were added
        run: |
          set -euo pipefail
          ! grep -Eqi 'service[_-]?role[^A-Za-z]*(key|secret)|BISA_SIP_PROD_PASSWORD|GAMERHUB_CF_ACCESS_CLIENT_SECRET|client_secret' v2/admin-streaming-prices.js v2/admin-gamerhub-wallet.js v2/bootstrap.js
