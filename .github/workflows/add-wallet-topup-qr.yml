name: Add Wallet topup QR and cancel

on:
  push:
    paths:
      - '.github/workflows/add-wallet-topup-qr.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Wallet UI
        run: python .github/patch-wallet-topup.py

      - name: Syntax check
        run: node --check v2/app.js

      - name: Verify frontend markers
        run: |
          grep -q "cancel_my_wallet_topup" v2/app.js
          grep -q "topupQrModal" v2/index.html
          grep -q "hasta 5 minutos" v2/app.js
          ! grep -qi "service_role" v2/app.js

      - name: Commit Wallet changes
        run: |
          if git diff --quiet -- v2/app.js v2/index.html; then
            echo "No Wallet changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/app.js v2/index.html
          git commit -m "Add Wallet topup QR and customer cancellation"
          git push
