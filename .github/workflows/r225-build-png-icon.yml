name: R225 Build PNG App Icon

on:
  push:
    branches: [codex/r225-pwa-whatsapp-delivery-copy]
    paths:
      - '.github/workflows/r225-build-png-icon.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/r225-pwa-whatsapp-delivery-copy
      - name: Build valid PNG icons from existing FRENCH STORE logo
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          source=''
          for candidate in             v2/assets/brand/membership-premium-logo.webp             v2/assets/brand/premium-profile-mascot-r189.webp             v2/assets/brand/french-store-mascot.webp             v2/assets/brand/premium-mascot-r178.webp; do
            if convert "$candidate" -format '%w %h' info: >/dev/null 2>&1; then
              source="$candidate"
              break
            fi
          done
          test -n "$source"
          echo "Using brand source: $source"

          convert "$source" -resize 430x430 -gravity center -background '#06111d' -extent 512x512 v2/assets/brand/icon-512.png
          convert "$source" -resize 162x162 -gravity center -background '#06111d' -extent 192x192 v2/assets/brand/icon-192.png

          python3 - <<'PY'
          from pathlib import Path
          import struct
          def png_size(path):
              p=Path(path).read_bytes()
              assert p[:8].hex()=='89504e470d0a1a0a', path
              return struct.unpack('>II',p[16:24])
          assert png_size('v2/assets/brand/icon-192.png')==(192,192)
          assert png_size('v2/assets/brand/icon-512.png')==(512,512)
          print('PNG icons OK')
          PY
      - name: Commit valid PNG icons to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/assets/brand/icon-192.png v2/assets/brand/icon-512.png
          if git diff --cached --quiet; then
            echo "No icon change needed"
            exit 0
          fi
          git commit -m "R225: generate valid FRENCH STORE PNG app icons"
          git push origin HEAD:codex/r225-pwa-whatsapp-delivery-copy
