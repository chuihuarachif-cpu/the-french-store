name: PWA Brand Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'v2/index.html'
      - 'v2/manifest.webmanifest'
      - 'v2/sw.js'
      - 'v2/pwa-init.js'
      - 'v2/pwa-install-ui.js'
      - 'v2/pwa-install.css'
      - 'v2/navigation-history.js'
      - 'v2/brand-ui.js'
      - 'v2/brand-motion.css'
      - 'v2/assets/brand/**'
      - '.github/workflows/pwa-brand-safety.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'v2/index.html'
      - 'v2/manifest.webmanifest'
      - 'v2/sw.js'
      - 'v2/pwa-init.js'
      - 'v2/pwa-install-ui.js'
      - 'v2/pwa-install.css'
      - 'v2/navigation-history.js'
      - 'v2/brand-ui.js'
      - 'v2/brand-motion.css'
      - 'v2/assets/brand/**'
      - '.github/workflows/pwa-brand-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pwa-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PWA and brand assets
        run: |
          set -euo pipefail
          test -s v2/manifest.webmanifest
          test -s v2/sw.js
          test -s v2/pwa-init.js
          test -s v2/pwa-install-ui.js
          test -s v2/pwa-install.css
          test -s v2/navigation-history.js
          test -s v2/brand-ui.js
          test -s v2/brand-motion.css
          test -s v2/assets/brand/icon-192.png
          test -s v2/assets/brand/icon-512.webp
          test -s v2/assets/brand/french-store-mascot.webp
          python3 - <<'PY'
          from pathlib import Path
          import struct
          def png_size(path):
              b=Path(path).read_bytes()
              assert b[:8].hex()=='89504e470d0a1a0a', path
              return struct.unpack('>II',b[16:24])
          assert png_size('v2/assets/brand/icon-192.png')==(192,192)
          webp512=Path('v2/assets/brand/icon-512.webp').read_bytes()
          assert webp512[:4]==b'RIFF' and webp512[8:12]==b'WEBP'
          webp=Path('v2/assets/brand/french-store-mascot.webp').read_bytes()
          assert webp[:4]==b'RIFF' and webp[8:12]==b'WEBP'
          print('Brand asset headers and dimensions OK')
          PY

      - name: Validate JavaScript syntax
        run: |
          node --check v2/sw.js
          node --check v2/pwa-init.js
          node --check v2/pwa-install-ui.js
          node --check v2/navigation-history.js
          node --check v2/brand-ui.js

      - name: Validate manifest contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('v2/manifest.webmanifest').read_text())
          assert data['id']=='/v2/'
          assert data['start_url']=='/v2/'
          assert data['scope']=='/v2/'
          assert data['display']=='standalone'
          assert 'standalone' in data.get('display_override',[])
          assert data.get('launch_handler',{}).get('client_mode')=='navigate-existing'
          assert data['theme_color']=='#06111d'
          assert data.get('prefer_related_applications') is False
          icons={i['sizes']:i for i in data['icons']}
          assert icons['192x192']['src']=='/v2/assets/brand/icon-192.png'
          assert icons['512x512']['src']=='/v2/assets/brand/icon-512.webp'
          assert icons['192x192']['type']=='image/png' and 'maskable' in icons['192x192']['purpose']
          assert icons['512x512']['type']=='image/webp' and 'maskable' in icons['512x512']['purpose']
          PY

      - name: Check storefront wiring and safe network behavior
        run: |
          set -euo pipefail
          grep -Fq 'rel="manifest" href="./manifest.webmanifest?v=20260918-r224"' v2/index.html
          grep -Fq './assets/brand/icon-192.png?v=20260918-r223' v2/index.html
          grep -Fq '/v2/assets/brand/icon-192.png?v=20260918-r223' index.html
          grep -Fq 'https://frenchstorebo.com/v2/assets/brand/icon-192.png' v2/index.html
          grep -Fq 'https://frenchstorebo.com/v2/assets/brand/icon-192.png' index.html
          grep -Fq 'twitter:card" content="summary"' v2/index.html
          grep -Fq 'twitter:card" content="summary"' index.html
          grep -Fq 'release=20260918-r223' index.html
          grep -Fq './brand-motion.css?v=20260823-1' v2/index.html
          grep -Fq './brand-ui.js?v=20260823-1' v2/index.html
          grep -Fq './pwa-init.js?v=20260918-r224' v2/index.html
          grep -Fq './pwa-install-ui.js?v=20260918-r224' v2/index.html
          grep -Fq './pwa-install.css?v=20260823-1' v2/index.html
          grep -Fq './navigation-history.js?v=20260823-1' v2/index.html
          grep -q 'beforeinstallprompt' v2/pwa-install-ui.js
          grep -q '!deferredPrompt' v2/pwa-install-ui.js
          ! grep -q 'social-share-r223' v2/sw.js
          grep -q 'history.pushState' v2/navigation-history.js
          grep -q "addEventListener('popstate'" v2/navigation-history.js
          grep -q './assets/brand/french-store-mascot.webp' v2/brand-ui.js
          grep -q "addEventListener('fetch'" v2/sw.js
          grep -q "url.origin!==location.origin" v2/sw.js
          grep -Fq "fs-store-r224-installfix-20260918" v2/sw.js
          ! grep -Eq 'api\.frenchstorebo\.com|supabase\.co|create_qr_order|create_wallet_order' v2/sw.js
          ! grep -R -E 'service_role|SUPABASE_SERVICE_ROLE|SUPABASE_SERVICE' v2/sw.js v2/pwa-init.js v2/pwa-install-ui.js v2/navigation-history.js v2/brand-ui.js v2/brand-motion.css v2/pwa-install.css v2/manifest.webmanifest

      - name: Serve and fetch PWA resources locally
        run: |
          python3 -m http.server 8080 >/tmp/fs-pwa-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8080/v2/ >/dev/null
          curl --fail http://127.0.0.1:8080/v2/index.html >/dev/null
          curl --fail http://127.0.0.1:8080/v2/manifest.webmanifest >/dev/null
          curl --fail http://127.0.0.1:8080/v2/sw.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/pwa-init.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/pwa-install-ui.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/assets/brand/icon-192.png >/dev/null
          curl --fail http://127.0.0.1:8080/v2/assets/brand/icon-512.webp >/dev/null
          curl --fail http://127.0.0.1:8080/v2/tiers/owner-classic-r7.css >/dev/null
