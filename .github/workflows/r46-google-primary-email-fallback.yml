name: R54 Google Only Public Auth

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/auth-google.js'
      - 'v2/auth-ease.js'
      - '.github/workflows/r46-google-primary-email-fallback.yml'
  push:
    branches: [main]
    paths:
      - 'v2/auth-google.js'
      - 'v2/auth-ease.js'
      - '.github/workflows/r46-google-primary-email-fallback.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: |
          node --check v2/auth-google.js
          node --check v2/auth-ease.js

      - name: Public auth is Google-only
        run: |
          set -euo pipefail
          grep -Fq "google-oauth-v4-20260825-r54" v2/auth-google.js
          grep -Fq "provider: 'google'" v2/auth-google.js
          grep -Fq "authChoiceGoogle" v2/auth-google.js
          grep -Fq "authGoogleHost" v2/auth-ease.js
          grep -Fq "Continúa con Google" v2/auth-ease.js
          ! grep -Fq "Entrar con correo" v2/auth-google.js
          ! grep -Fq "Crear cuenta con correo (alternativa)" v2/auth-google.js
          ! grep -Fq "authLegacySignupFallback" v2/auth-ease.js
          ! grep -Fq "authChoiceSignup" v2/auth-ease.js
          ! grep -Fq "signUpFriendly" v2/auth-ease.js

      - name: Stale public email UI is removed fail-safe
        run: |
          set -euo pipefail
          grep -Fq "sanitizePublicAuth" v2/auth-google.js
          grep -Fq "authChoiceLogin')?.remove" v2/auth-google.js
          grep -Fq "authChoiceSignup')?.remove" v2/auth-google.js
          grep -Fq "loginEmail')?.closest('label')?.classList.add('hidden')" v2/auth-google.js
          grep -Fq "loginPassword')?.closest('label')?.classList.add('hidden')" v2/auth-google.js

      - name: OAuth remains fail-safe and secret-free
        run: |
          set -euo pipefail
          grep -Fq "data?.external?.google === true" v2/auth-google.js
          grep -Fq "credentials: 'omit'" v2/auth-google.js
          grep -Fq "PROVIDER_RETRY_LIMIT = 5" v2/auth-google.js
          grep -Fq "PROVIDER_FETCH_TIMEOUT_MS = 2500" v2/auth-google.js
          ! grep -Eqi 'client_secret|provider_token|service_role|googleusercontent\.com' v2/auth-google.js v2/auth-ease.js

      - name: Email provider is not disabled by frontend code
        run: |
          set -euo pipefail
          ! grep -Eqi 'disable.*email|email.*disabled|signOut.*email' v2/auth-google.js v2/auth-ease.js
          echo 'R54 removes the public email entry point only. Supabase Email is disabled later after a successful admin Google-login test.'
