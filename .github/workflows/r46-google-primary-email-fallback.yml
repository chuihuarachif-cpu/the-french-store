name: R46 Google Primary Email Fallback

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/auth-google.js'
      - '.github/workflows/r46-google-primary-email-fallback.yml'
  push:
    branches: [main]
    paths:
      - 'v2/auth-google.js'
      - '.github/workflows/r46-google-primary-email-fallback.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax
        run: node --check v2/auth-google.js

      - name: Google stays primary without locking out existing users
        run: |
          set -euo pipefail
          grep -Fq "google-oauth-v3-20260824-r46" v2/auth-google.js
          grep -Fq "provider: 'google'" v2/auth-google.js
          grep -Fq "Entrar con correo" v2/auth-google.js
          grep -Fq "signup.classList.add('hidden')" v2/auth-google.js
          grep -Fq "authLegacySignupFallback" v2/auth-google.js
          grep -Fq "Crear cuenta con correo (alternativa)" v2/auth-google.js
          grep -Fq "window.FSAuthEase?.showSignupMode?.()" v2/auth-google.js

      - name: OAuth remains fail-safe and secret-free
        run: |
          set -euo pipefail
          grep -Fq "data?.external?.google === true" v2/auth-google.js
          grep -Fq "credentials: 'omit'" v2/auth-google.js
          grep -Fq "PROVIDER_RETRY_LIMIT = 5" v2/auth-google.js
          grep -Fq "PROVIDER_FETCH_TIMEOUT_MS = 2500" v2/auth-google.js
          ! grep -Eqi 'client_secret|provider_token|service_role' v2/auth-google.js

      - name: Email auth is not disabled by the transition layer
        run: |
          set -euo pipefail
          ! grep -Eqi 'disable.*email|email.*disabled|signOut.*email' v2/auth-google.js
          echo 'R46 only changes entry-point presentation; Supabase email auth remains intact.'
