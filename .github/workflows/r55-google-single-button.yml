name: R55 Google Single Button

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/auth-google.js'
      - 'v2/auth-ease.js'
      - 'v2/index.html'
      - '.github/workflows/r55-google-single-button.yml'
  push:
    branches: [main]
    paths:
      - 'v2/auth-google.js'
      - 'v2/auth-ease.js'
      - 'v2/index.html'
      - '.github/workflows/r55-google-single-button.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          set -euo pipefail
          node --check v2/auth-google.js
          node --check v2/auth-ease.js
      - name: Exactly one Google button mount contract
        run: |
          set -euo pipefail
          grep -Fq "googleMountInProgress" v2/auth-google.js
          grep -Fq "dedupeGoogleButtons" v2/auth-google.js
          grep -Fq "document.getElementById('authChoiceGoogle')" v2/auth-google.js
          grep -Fq "authGoogleHost" v2/auth-ease.js
          ! grep -Eqi "client_secret|service_role|SUPABASE_SERVICE_ROLE_KEY" v2/auth-google.js v2/auth-ease.js v2/index.html
      - name: Cyan button and cache bust
        run: |
          set -euo pipefail
          grep -Fq "linear-gradient(180deg,#38d7ff 0%,#11b8ff 50%,#0787ff 100%)" v2/auth-google.js
          grep -Fq "auth-google.js?v=20260825-r55" v2/index.html
