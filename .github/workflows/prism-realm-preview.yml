name: Prism Realm Preview

on:
  push:
    branches: [game/prism-realm]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: prism-realm
        run: npm install --no-audit --no-fund

      - name: Prepare offline assets
        working-directory: prism-realm
        run: npm run prepare:assets

      - name: Install Playwright Chromium
        working-directory: prism-realm
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Render previews
        working-directory: prism-realm
        run: node scripts/render-preview.mjs

      - name: Publish previews to render-previews branch
        working-directory: prism-realm/previews
        run: |
          git init -q -b render-previews
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Previews ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" render-previews
