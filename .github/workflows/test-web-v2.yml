name: Test Web V2

on:
  push:
    branches: [main, web-v2-integration]
    paths:
      - 'v2/**'
      - '404.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/test-web-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - '404.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/test-web-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -s 404.html
          test -s v2/index.html
          test -s v2/styles.css
          test -s v2/app.js
          test -s v2/r8.css
          test -s v2/r8.js
          test -s v2/r8-icons.css
          test -s v2/r8-icons.js
          test -s v2/legal.css
          test -s v2/legal.js
          test -s v2/bisa-checkout.css
          test -s v2/bisa-checkout.js
          test -s v2/order-cancel-ui.css
          test -s v2/order-cancel-ui.js
          test -s v2/bisa-wallet.js
          test -s v2/catalog-order.js
          test -s v2/admin-order-ui.js
          test -s v2/paid-whatsapp.js
          test -s v2/modal-stability.js
          test -s v2/privacy.html
          test -s v2/terms.html
          test -s v2/refunds.html
          test -s v2/cookies.html
          test -s v2/about.html
          test -s robots.txt
          test -s sitemap.xml

      - name: Validate JavaScript syntax
        run: |
          node --check v2/app.js
          node --check v2/r8.js
          node --check v2/r8-icons.js
          node --check v2/legal.js
          node --check v2/bisa-checkout.js
          node --check v2/order-cancel-ui.js
          node --check v2/bisa-wallet.js
          node --check v2/catalog-order.js
          node --check v2/admin-order-ui.js
          node --check v2/paid-whatsapp.js
          node --check v2/modal-stability.js

      - name: Check critical frontend contracts
        run: |
          grep -q "create_wallet_order" v2/app.js
          grep -q "create_qr_order" v2/app.js
          grep -q "request_wallet_topup_v2" v2/app.js
          grep -q "admin_update_order_status" v2/app.js
          grep -q "/bisa-sip/order-qr" v2/bisa-checkout.js
          grep -q "/bisa-sip/order-status" v2/bisa-checkout.js
          grep -q "/bisa-sip/order-cancel" v2/order-cancel-ui.js
          grep -q "PAYMENT_ALREADY_CONFIRMED" v2/order-cancel-ui.js
          grep -q "Cancelar pedido" v2/order-cancel-ui.js
          grep -q "orderCancelConfirmModal" v2/order-cancel-ui.js
          grep -q "FSModalStability" v2/order-cancel-ui.js
          grep -q 'data-close="orderCancelConfirmModal"' v2/order-cancel-ui.js
          grep -q "setCancellationBusy" v2/order-cancel-ui.js
          grep -q "/bisa-sip/topup-qr" v2/bisa-wallet.js
          grep -q "/bisa-sip/topup-status" v2/bisa-wallet.js
          grep -q "/bisa-sip/topup-cancel" v2/bisa-wallet.js
          grep -q "No \"Pagado\"/WhatsApp button" v2/bisa-wallet.js
          grep -q "B+G" v2/paid-whatsapp.js
          grep -q "product_name,quantity" v2/paid-whatsapp.js
          grep -q "🛒 Productos" v2/paid-whatsapp.js
          grep -q "Observe ONLY child-list changes" v2/paid-whatsapp.js
          grep -q "childList: true, subtree: true" v2/paid-whatsapp.js
          ! grep -q "attributeFilter" v2/paid-whatsapp.js
          grep -q "50+50 => 100" v2/catalog-order.js
          grep -q "500+500 => 1000" v2/catalog-order.js
          grep -q "mlbbGemX2" v2/catalog-order.js
          grep -q "currentCategoryIsRechargeById" v2/catalog-order.js
          grep -q "pureCurrency" v2/catalog-order.js
          grep -q "themedAdminOrderStatus" v2/admin-order-ui.js
          grep -q "admin_update_order_status" v2/admin-order-ui.js
          grep -q "paid-order-btn" v2/bisa-checkout.css
          grep -q "2147483000" v2/bisa-checkout.css
          ! grep -q "body.fs-modal-open" v2/bisa-checkout.css
          ! grep -q "pointer-events:none.*#mainContent" v2/bisa-checkout.css
          grep -q "clearLegacyPageLock" v2/modal-stability.js
          grep -q "showModal" v2/modal-stability.js
          grep -q "hideModal" v2/modal-stability.js
          grep -q "patchGlobalHelpers" v2/modal-stability.js
          grep -q "installPublicApi" v2/modal-stability.js
          grep -q "orderCancelConfirmModal" v2/modal-stability.js
          grep -q "pageshow" v2/modal-stability.js
          ! grep -q "MutationObserver" v2/modal-stability.js
          ! grep -q "setInterval" v2/modal-stability.js
          grep -q "modal-stability.js?v=20260820-2108" v2/index.html
          grep -q "bisa-checkout.css?v=20260820-2108" v2/index.html
          grep -q "order-cancel-ui.js?v=20260820-2036" v2/index.html
          grep -q "bisa-wallet.js" v2/index.html
          grep -q "order-cancel-ui.css" v2/index.html
          grep -q "catalog-order.js" v2/index.html
          grep -q "admin-order-ui.js" v2/index.html
          grep -q "paid-whatsapp.js" v2/index.html
          grep -q "QR individual de pago" v2/index.html
          grep -q "QR individual de pago" v2/bisa-checkout.js
          grep -q "Cuando el pago sea confirmado" v2/bisa-wallet.js
          grep -q "Sumaremos todos los productos seleccionados" v2/index.html
          ! grep -q "Supabase al crear el pedido" v2/index.html
          ! grep -q "Pago confirmado por BISA" v2/bisa-checkout.js
          ! grep -q "Referencia BISA" v2/bisa-wallet.js
          grep -q "https://api.frenchstorebo.com" v2/index.html
          ! grep -R -E "service_role|SUPABASE_SERVICE|SUPABASE_SERVICE_ROLE" v2 --include='*.js' --include='*.html'

      - name: Check category separation
        run: |
          grep -q "Recargas por ID" v2/app.js
          grep -q "Recargas por Cuenta" v2/app.js
          grep -q "Streaming" v2/app.js
          grep -q "Gift Cards" v2/app.js

      - name: Check launch legal and trust links
        run: |
          grep -q "privacy.html" v2/index.html
          grep -q "terms.html" v2/index.html
          grep -q "refunds.html" v2/index.html
          grep -q "cookies.html" v2/index.html
          grep -q "legalAccept" v2/legal.js
          grep -q "purchaseLegalAccept" v2/index.html
          grep -q "frenchstorebo.com" sitemap.xml
          grep -q "Sitemap: https://frenchstorebo.com/sitemap.xml" robots.txt
          grep -q "Volver a FRENCH STORE" 404.html
          grep -q 'content="noindex,follow"' 404.html

      - name: Start local preview
        run: |
          python3 -m http.server 8080 > /tmp/french-store-http.log 2>&1 &
          echo $! > /tmp/french-store-http.pid
          sleep 2
          curl --fail http://127.0.0.1:8080/404.html >/dev/null
          curl --fail http://127.0.0.1:8080/v2/index.html >/dev/null
          curl --fail http://127.0.0.1:8080/v2/privacy.html >/dev/null
          curl --fail http://127.0.0.1:8080/v2/terms.html >/dev/null
          curl --fail http://127.0.0.1:8080/v2/refunds.html >/dev/null
          curl --fail http://127.0.0.1:8080/v2/catalog-order.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/admin-order-ui.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/order-cancel-ui.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/modal-stability.js >/dev/null

      - name: Browser-test modal open and close
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            echo "Google Chrome not found on runner"
            exit 1
          fi
          cat > v2/__modal-smoke.html <<'HTML'
          <!doctype html><html><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./bisa-checkout.css">
          </head><body>
          <button id="backgroundButton">Fondo</button>
          <div id="qrModal" class="modal" aria-hidden="true"><div class="modal-card"><button id="closeButton" data-close="qrModal">X</button><p>QR TEST</p></div></div>
          <div id="result">WAIT</div>
          <script src="./modal-stability.js"></script>
          <script>
          addEventListener('DOMContentLoaded',()=>setTimeout(()=>{
            const m=document.getElementById('qrModal');
            const r=document.getElementById('result');
            const openCalled=window.FSModalStability?.open('qrModal')===true;
            const csOpen=getComputedStyle(m);
            const openOk=openCalled&&m.classList.contains('open')&&m.getAttribute('aria-hidden')==='false'&&csOpen.display==='flex'&&csOpen.pointerEvents==='auto'&&!document.body.classList.contains('fs-modal-open')&&!document.documentElement.classList.contains('fs-modal-open');
            document.getElementById('closeButton').click();
            setTimeout(()=>{
              const csClosed=getComputedStyle(m);
              const closeOk=!m.classList.contains('open')&&m.getAttribute('aria-hidden')==='true'&&csClosed.display==='none'&&csClosed.pointerEvents==='none'&&!document.body.classList.contains('fs-modal-open')&&!document.documentElement.classList.contains('fs-modal-open');
              r.textContent=openOk&&closeOk?'MODAL_SMOKE_PASS':'MODAL_SMOKE_FAIL';
            },50);
          },50));
          </script></body></html>
          HTML
          "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=1200 --dump-dom http://127.0.0.1:8080/v2/__modal-smoke.html > /tmp/modal-smoke-dom.txt
          grep -q "MODAL_SMOKE_PASS" /tmp/modal-smoke-dom.txt
          rm -f v2/__modal-smoke.html

      - name: Capture responsive screenshots
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            echo "Google Chrome not found on runner"
            exit 1
          fi
          mkdir -p screenshots
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=360,800 --virtual-time-budget=8000 --screenshot=screenshots/mobile-360.png http://127.0.0.1:8080/v2/index.html
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,844 --virtual-time-budget=8000 --screenshot=screenshots/mobile-390.png http://127.0.0.1:8080/v2/index.html
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=768,1024 --virtual-time-budget=8000 --screenshot=screenshots/tablet-768.png http://127.0.0.1:8080/v2/index.html
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1366,768 --virtual-time-budget=8000 --screenshot=screenshots/desktop-1366.png http://127.0.0.1:8080/v2/index.html
          test -s screenshots/mobile-360.png
          test -s screenshots/mobile-390.png
          test -s screenshots/tablet-768.png
          test -s screenshots/desktop-1366.png

      - name: Upload responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: web-v2-responsive-screenshots
          path: screenshots/*.png
          retention-days: 7
