name: Test Web V2

on:
  push:
    branches: [main, web-v2-integration]
    paths:
      - 'v2/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/test-web-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'v2/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '.github/workflows/test-web-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -s v2/index.html
          test -s v2/styles.css
          test -s v2/app.js
          test -s v2/bootstrap.js
          test -s v2/config/storefront.js
          test -s v2/core/runtime.js
          test -s v2/core/navigation.js
          test -s v2/core/ui.js
          test -s v2/features/catalog.js
          test -s v2/features/cart.js
          test -s v2/features/auth.js
          test -s v2/features/wallet.js
          test -s v2/features/orders-admin.js
          test -s v2/r8.css
          test -s v2/r8.js
          test -s v2/r8-icons.css
          test -s v2/r8-icons.js
          test -s v2/legal.css
          test -s v2/legal.js
          test -s v2/legal-account.js
          test -s v2/player-verify.js
          test -s v2/buy-now.js
          test -s v2/bisa-checkout.css
          test -s v2/bisa-checkout.js
          test -s v2/order-cancel-ui.css
          test -s v2/order-cancel-ui.js
          test -s v2/bisa-wallet.js
          test -s v2/catalog-order.js
          test -s v2/admin-order-ui.js
          test -s v2/admin-fulfillment-ui.js
          test -s v2/paid-whatsapp.js
          test -s v2/fulfillment-inputs.js
          test -s v2/privacy.html
          test -s v2/terms.html
          test -s v2/refunds.html
          test -s v2/cookies.html
          test -s v2/about.html
          test -s robots.txt
          test -s sitemap.xml

      - name: Validate JavaScript syntax
        run: |
          node --check v2/app.js
          node --check v2/bootstrap.js
          node --check v2/config/storefront.js
          node --check v2/core/runtime.js
          node --check v2/core/navigation.js
          node --check v2/core/ui.js
          node --check v2/features/catalog.js
          node --check v2/features/cart.js
          node --check v2/features/auth.js
          node --check v2/features/wallet.js
          node --check v2/features/orders-admin.js
          node --check v2/r8.js
          node --check v2/r8-icons.js
          node --check v2/legal.js
          node --check v2/legal-account.js
          node --check v2/player-verify.js
          node --check v2/buy-now.js
          node --check v2/auth-ease.js
          node --check v2/auth-confirm.js
          node --check v2/bisa-checkout.js
          node --check v2/order-cancel-ui.js
          node --check v2/bisa-wallet.js
          node --check v2/catalog-order.js
          node --check v2/admin-order-ui.js
          node --check v2/admin-fulfillment-ui.js
          node --check v2/paid-whatsapp.js
          node --check v2/fulfillment-inputs.js

      - name: Check modular architecture contracts
        run: |
          grep -q 'bootstrap.js' v2/index.html
          ! grep -q '<script[^>]*app.js' v2/index.html
          ! grep -q '<script[^>]*bisa-checkout.js' v2/index.html
          ! grep -q '<script[^>]*bisa-wallet.js' v2/index.html
          ! grep -q '<script[^>]*fulfillment-inputs.js' v2/index.html
          ! grep -q '<script[^>]*admin-order-ui.js' v2/index.html
          ! grep -q '<script[^>]*admin-fulfillment-ui.js' v2/index.html
          ! grep -q '<script[^>]*r8.js' v2/index.html
          ! grep -q '<link[^>]*bisa-checkout.css' v2/index.html
          ! grep -q '<link[^>]*order-cancel-ui.css' v2/index.html
          ! grep -q '<link[^>]*r8.css' v2/index.html
          grep -q './config/storefront.js' v2/bootstrap.js
          grep -q './core/runtime.js' v2/bootstrap.js
          grep -q './core/navigation.js' v2/bootstrap.js
          grep -q './features/catalog.js' v2/bootstrap.js
          grep -q './features/cart.js' v2/bootstrap.js
          grep -q './features/auth.js' v2/bootstrap.js
          grep -q './features/wallet.js' v2/bootstrap.js
          grep -q './features/orders-admin.js' v2/bootstrap.js
          grep -q './core/ui.js' v2/bootstrap.js
          grep -q './bisa-checkout.js' v2/bootstrap.js
          grep -q './bisa-wallet.js' v2/bootstrap.js
          grep -q './fulfillment-inputs.js' v2/bootstrap.js
          grep -q './admin-order-ui.js' v2/bootstrap.js
          grep -q './admin-fulfillment-ui.js' v2/bootstrap.js
          grep -q './r8.js' v2/bootstrap.js
          grep -q 'SCRIPT_LOAD_FAILED' v2/bootstrap.js
          grep -q 'No se pudo cargar el módulo seguro de pago' v2/bootstrap.js
          python3 - <<'PY'
          from pathlib import Path
          text=Path('v2/bootstrap.js').read_text()
          expected=['./config/storefront.js','./core/runtime.js','./core/navigation.js','./features/catalog.js','./features/cart.js','./features/auth.js','./features/wallet.js','./features/orders-admin.js','./core/ui.js']
          pos=-1
          for item in expected:
              nxt=text.index(item)
              assert nxt>pos, f'Core load order broken at {item}'
              pos=nxt
          assert text.index('./bisa-checkout.js') < text.index('./fulfillment-inputs.js')
          PY

      - name: Check critical frontend contracts
        run: |
          grep -q "create_wallet_order" v2/features/cart.js
          grep -q "create_qr_order" v2/features/cart.js
          grep -q "request_wallet_topup_v2" v2/features/wallet.js
          grep -q "admin_update_order_status" v2/features/orders-admin.js
          grep -q "/bisa-sip/order-qr" v2/bisa-checkout.js
          grep -q "/bisa-sip/order-status" v2/bisa-checkout.js
          grep -q "/bisa-sip/order-cancel" v2/order-cancel-ui.js
          grep -q "PAYMENT_ALREADY_CONFIRMED" v2/order-cancel-ui.js
          grep -q "Cancelar pedido" v2/order-cancel-ui.js
          grep -q "orderCancelConfirmModal" v2/order-cancel-ui.js
          grep -q "/bisa-sip/topup-qr" v2/bisa-wallet.js
          grep -q "/bisa-sip/topup-status" v2/bisa-wallet.js
          grep -q "/bisa-sip/topup-cancel" v2/bisa-wallet.js
          grep -q "No \"Pagado\"/WhatsApp button" v2/bisa-wallet.js
          grep -q "B+G" v2/paid-whatsapp.js
          grep -q "product_name,quantity" v2/paid-whatsapp.js
          grep -q "🛒 Productos" v2/paid-whatsapp.js
          grep -q "Observe ONLY child-list changes" v2/paid-whatsapp.js
          grep -q "childList: true, subtree: true" v2/paid-whatsapp.js
          ! grep -q "attributeFilter" v2/paid-whatsapp.js
          grep -q "50+50 => 100" v2/catalog-order.js
          grep -q "500+500 => 1000" v2/catalog-order.js
          grep -q "mlbbGemX2" v2/catalog-order.js
          grep -q "currentCategoryIsRechargeById" v2/catalog-order.js
          grep -q "pureCurrency" v2/catalog-order.js
          grep -q "themedAdminOrderStatus" v2/admin-order-ui.js
          grep -q "admin_update_order_status" v2/admin-order-ui.js
          grep -q "paid-order-btn" v2/bisa-checkout.css
          grep -q "QR individual de pago" v2/index.html
          grep -q "QR individual de pago" v2/bisa-checkout.js
          grep -q "Cuando el pago sea confirmado" v2/bisa-wallet.js
          ! grep -q "Pago confirmado por BISA" v2/bisa-checkout.js
          ! grep -q "Referencia BISA" v2/bisa-wallet.js
          grep -q "https://api.frenchstorebo.com" v2/index.html
          ! grep -R -E "service_role|SUPABASE_SERVICE|SUPABASE_SERVICE_ROLE" v2 --include='*.js' --include='*.html'

      - name: Check price and catalog source-of-truth separation
        run: |
          grep -q "Recargas por ID" v2/config/storefront.js
          grep -q "Recargas por Cuenta" v2/config/storefront.js
          grep -q "Streaming" v2/config/storefront.js
          grep -q "Gift Cards" v2/config/storefront.js
          grep -q "sb.from('productos')" v2/features/catalog.js
          grep -q "id,juego,paquete,categoria,precio,activo" v2/features/catalog.js
          ! grep -Eqi "precio_proveedor|tipo_cambio|gamerhub|bonoxs|gameton" v2/config/storefront.js

      - name: Check launch legal, player verify and direct-buy UX
        run: |
          grep -q "privacy.html" v2/index.html
          grep -q "terms.html" v2/index.html
          grep -q "refunds.html" v2/index.html
          grep -q "cookies.html" v2/index.html
          grep -q 'id="legalAccept"' v2/index.html
          ! grep -q 'id="purchaseLegalAccept"' v2/index.html
          grep -q "fs_terms_accepted" v2/legal-account.js
          grep -q "fs_privacy_accepted" v2/legal-account.js
          grep -q "/api/player-verify" v2/player-verify.js
          grep -q "Verificar ID" v2/player-verify.js
          grep -q "Cuenta encontrada" v2/player-verify.js
          grep -q "Comprar ahora" v2/buy-now.js
          grep -q "Añadir al carrito" v2/buy-now.js
          grep -q "./legal-account.js?v=20260823-1" v2/index.html
          grep -q "./player-verify.js?v=20260823-1" v2/index.html
          grep -q "./buy-now.js?v=20260823-2" v2/index.html
          grep -q "frenchstorebo.com" sitemap.xml
          grep -q "Sitemap: https://frenchstorebo.com/sitemap.xml" robots.txt

      - name: Start local preview
        run: |
          python3 -m http.server 8080 > /tmp/french-store-http.log 2>&1 &
          echo $! > /tmp/french-store-http.pid
          sleep 2
          curl --fail http://127.0.0.1:8080/v2/index.html >/dev/null
          curl --fail http://127.0.0.1:8080/v2/bootstrap.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/config/storefront.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/core/runtime.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/features/catalog.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/features/cart.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/privacy.html >/dev/null
          curl --fail http://127.0.0.1:8080/v2/terms.html >/dev/null
          curl --fail http://127.0.0.1:8080/v2/refunds.html >/dev/null
          curl --fail http://127.0.0.1:8080/v2/catalog-order.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/admin-order-ui.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/order-cancel-ui.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/legal-account.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/player-verify.js >/dev/null
          curl --fail http://127.0.0.1:8080/v2/buy-now.js >/dev/null

      - name: Browser-test modular bootstrap
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME"
          timeout 25s "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=10000 --dump-dom http://127.0.0.1:8080/v2/index.html > /tmp/bootstrap-dom.txt
          grep -q 'data-fs-bootstrap="ready"' /tmp/bootstrap-dom.txt || { cat /tmp/bootstrap-dom.txt; cat /tmp/french-store-http.log; exit 1; }
          ! grep -q 'No se pudo iniciar la tienda correctamente' /tmp/bootstrap-dom.txt

      - name: Browser-test every lazy feature module
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME"
          python3 - <<'PY'
          from pathlib import Path
          src=Path('v2/index.html').read_text()
          probe=r'''window.__fsLazyErrors=[];
          window.onerror=(message)=>{ window.__fsLazyErrors.push(String(message||'error')); };
          window.addEventListener('unhandledrejection',(event)=>{ window.__fsLazyErrors.push(String(event.reason||'rejection')); });
          window.addEventListener('load', async()=>{
            const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
            for(let i=0;i<100 && !window.FSFeatureLoader;i++) await sleep(100);
            if(!window.FSFeatureLoader){ document.documentElement.dataset.fsLazyTest='no-loader'; return; }
            try{
              for(const name of ['checkout','wallet','orders','admin','catalog','motion']) await window.FSFeatureLoader.ensure(name);
              await sleep(600);
              document.documentElement.dataset.fsLazyFeatures=window.FSFeatureLoader.readyFeatures().sort().join(',');
              document.documentElement.dataset.fsLazyTest=window.__fsLazyErrors.length?'runtime-error':'pass';
              if(window.__fsLazyErrors.length) document.documentElement.dataset.fsLazyError=window.__fsLazyErrors[0].slice(0,80);
            }catch(error){
              document.documentElement.dataset.fsLazyTest='load-error';
              document.documentElement.dataset.fsLazyError=String(error?.message||error).slice(0,80);
            }
          });
          '''
          Path('v2/__modular-lazy-test.js').write_text(probe)
          Path('v2/__modular-lazy-test.html').write_text(src.replace('</body>','<script src="./__modular-lazy-test.js"></script>\n</body>'))
          PY
          node --check v2/__modular-lazy-test.js
          timeout 35s "$CHROME" --headless --disable-gpu --no-sandbox --virtual-time-budget=22000 --dump-dom http://127.0.0.1:8080/v2/__modular-lazy-test.html > /tmp/lazy-dom.txt
          grep -q 'data-fs-lazy-test="pass"' /tmp/lazy-dom.txt || { cat /tmp/lazy-dom.txt; cat /tmp/french-store-http.log; exit 1; }
          grep -q 'data-fs-lazy-features="admin,catalog,checkout,motion,orders,wallet"' /tmp/lazy-dom.txt
          rm -f v2/__modular-lazy-test.html v2/__modular-lazy-test.js

      - name: Capture responsive screenshots
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then
            echo "Google Chrome not found on runner"
            exit 1
          fi
          mkdir -p screenshots
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=360,800 --virtual-time-budget=10000 --screenshot=screenshots/mobile-360.png http://127.0.0.1:8080/v2/index.html
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=390,844 --virtual-time-budget=10000 --screenshot=screenshots/mobile-390.png http://127.0.0.1:8080/v2/index.html
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=768,1024 --virtual-time-budget=10000 --screenshot=screenshots/tablet-768.png http://127.0.0.1:8080/v2/index.html
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1366,768 --virtual-time-budget=10000 --screenshot=screenshots/desktop-1366.png http://127.0.0.1:8080/v2/index.html
          test -s screenshots/mobile-360.png
          test -s screenshots/mobile-390.png
          test -s screenshots/tablet-768.png
          test -s screenshots/desktop-1366.png

      - name: Upload responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: web-v2-responsive-screenshots
          path: screenshots/*.png
          retention-days: 7