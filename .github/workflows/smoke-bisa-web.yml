name: Smoke BISA Storefront

on:
  push:
    branches: [main]
    paths:
      - 'v2/index.html'
      - 'v2/runtime-health.js'
      - 'v2/vendor/**'
      - 'v2/r6.*'
      - 'v2/r7fix.*'
      - 'v2/bisa-checkout.js'
      - 'v2/bisa-checkout.css'
      - '.github/workflows/smoke-bisa-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate local critical assets
        run: |
          for f in v2/runtime-health.js v2/vendor/supabase-2.112.3.js v2/r6.css v2/r6.js v2/r7fix.css v2/r7fix.js v2/bisa-checkout.js v2/bisa-checkout.css; do test -s "$f"; done
          node --check v2/runtime-health.js
          node --check v2/r6.js
          node --check v2/r7fix.js
          node --check v2/bisa-checkout.js
          grep -q './vendor/supabase-2.112.3.js' v2/index.html
          grep -q './runtime-health.js' v2/index.html
          grep -q 'https://api.frenchstorebo.com' v2/index.html
          ! grep -q 'cdn.jsdelivr.net' v2/index.html
          ! grep -E 'service_role|SUPABASE_SERVICE_ROLE' v2/bisa-checkout.js

      - name: Wait for GitHub Pages/custom-domain publication
        run: sleep 60

      - name: Verify live storefront critical assets
        run: |
          curl --fail --retry 4 --retry-delay 10 -sS https://frenchstorebo.com/v2/ -o /tmp/index.html
          grep -q './vendor/supabase-2.112.3.js' /tmp/index.html
          grep -q './runtime-health.js' /tmp/index.html
          grep -q './r6.js' /tmp/index.html
          grep -q './r7fix.js' /tmp/index.html
          grep -q './bisa-checkout.js' /tmp/index.html
          grep -q 'https://api.frenchstorebo.com' /tmp/index.html
          ! grep -q 'cdn.jsdelivr.net' /tmp/index.html
          for asset in runtime-health.js vendor/supabase-2.112.3.js r6.js r7fix.js bisa-checkout.js bisa-checkout.css; do
            curl --fail --retry 4 --retry-delay 5 -sS "https://frenchstorebo.com/v2/$asset" -o "/tmp/$(basename "$asset")"
            test -s "/tmp/$(basename "$asset")"
          done
          grep -q 'createClient' /tmp/supabase-2.112.3.js
          grep -q 'SUPABASE_CLIENT_MISSING' /tmp/runtime-health.js
          node --check /tmp/r6.js
          node --check /tmp/r7fix.js
          node --check /tmp/bisa-checkout.js
          grep -q '/bisa-sip/order-qr' /tmp/bisa-checkout.js
          grep -q 'paid-order-btn' /tmp/bisa-checkout.css

      - name: Record successful live check
        env:
          SHA: ${{ github.sha }}
        run: |
          mkdir -p .checks
          printf 'BISA storefront live smoke test: PASS\nSource commit: %s\nChecked at UTC: %s\nNo order or QR was created by this test.\n' "$SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > .checks/bisa-web-smoke.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .checks/bisa-web-smoke.txt
          git commit -m 'Record BISA storefront smoke test pass' || exit 0
          git push
