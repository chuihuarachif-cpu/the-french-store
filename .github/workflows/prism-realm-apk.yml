name: Prism Realm APK

on:
  push:
    branches: [game/prism-realm]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: prism-realm
        run: npm install

      - name: Bundle Three.js locally (sin CDN)
        working-directory: prism-realm
        run: |
          mkdir -p www/vendor/jsm
          cp node_modules/three/build/three.module.js www/vendor/
          cp -r node_modules/three/examples/jsm/. www/vendor/jsm/
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js#./vendor/three.module.js#; s#https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/#./vendor/jsm/#' www/index.html
          grep -q './vendor/three.module.js' www/index.html

      - name: Generate Android project
        working-directory: prism-realm
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: prism-realm/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PrismRealm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrismRealm-apk
          path: prism-realm/PrismRealm.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prism-realm-${{ github.run_number }}
          name: Prism Realm build ${{ github.run_number }}
          files: prism-realm/PrismRealm.apk
