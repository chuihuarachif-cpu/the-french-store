name: Prism Realm APK

on:
  push:
    branches: [game/prism-realm]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: prism-realm
        run: npm install --no-audit --no-fund

      - name: Verificar modelo del nivel 1 (60 tornillos)
        working-directory: prism-realm
        run: node scripts/check-level1.mjs

      - name: Prepare offline assets (Three.js + iconos)
        working-directory: prism-realm
        run: |
          npm run prepare:assets
          test -f www/vendor/three/build/three.module.js
          test -f www/vendor/three/examples/jsm/controls/OrbitControls.js
          test -f www/vendor/three/examples/jsm/environments/RoomEnvironment.js
          test -f www/icons/icon-192.png
          test -f www/icons/icon-512.png

      - name: Generate Android project
        working-directory: prism-realm
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: prism-realm/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PrismRealm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrismRealm-apk
          path: prism-realm/PrismRealm.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prism-realm-${{ github.run_number }}
          name: Prism Realm build ${{ github.run_number }}
          files: prism-realm/PrismRealm.apk
