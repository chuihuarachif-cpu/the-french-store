name: R170 Rank and CPX Rewards UI Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/index.html'
      - 'v2/bootstrap.js'
      - 'v2/notifications.js'
      - 'v2/notifications.css'
      - 'v2/rank-pass-premium.js'
      - 'v2/rank-pass-premium-ready.js'
      - 'v2/rank-pass-premium.css'
      - 'v2/rewarded-ads-ui.js'
      - 'v2/rewarded-ads.css'
      - 'v2/cpx-rewards-provider.js'
      - 'v2/cpx-rewards.css'
      - 'scripts/test-r47-premium-rewards-ui.mjs'
      - '.github/workflows/r47-premium-rewards-ui-safety.yml'
  push:
    branches: [main]
    paths:
      - 'v2/rank-pass-premium.js'
      - 'v2/rank-pass-premium-ready.js'
      - 'v2/rank-pass-premium.css'
      - 'v2/rewarded-ads-ui.js'
      - 'v2/rewarded-ads.css'
      - 'scripts/test-r47-premium-rewards-ui.mjs'
      - '.github/workflows/r47-premium-rewards-ui-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated module syntax
        run: |
          set -euo pipefail
          for f in v2/notifications.js v2/rank-pass-premium.js v2/rank-pass-premium-ready.js v2/rewarded-ads-ui.js v2/cpx-rewards-provider.js; do
            test -s "$f"
            node --check "$f"
          done
      - name: Run R170 safety contract
        run: node scripts/test-r47-premium-rewards-ui.mjs
      - name: Guard secrets and critical checkout contracts
        run: |
          set -euo pipefail
          ! grep -REn 'SUPABASE_SERVICE_ROLE_KEY|service_role|CPX_APP_SECURITY_HASH|GAMERHUB_API|BISA.*PASSWORD' v2/notifications.js v2/rank-pass-premium.js v2/rank-pass-premium-ready.js v2/rewarded-ads-ui.js v2/cpx-rewards-provider.js
          grep -Fq 'id="checkoutWallet"' v2/index.html
          grep -Fq 'id="checkoutQR"' v2/index.html
          grep -Fq 'id="qrModal"' v2/index.html
          grep -Fq 'id="topupQrModal"' v2/index.html
          grep -Fq 'https://api.frenchstorebo.com' v2/index.html
      - name: Guard voluntary third-party loading
        run: |
          set -euo pipefail
          grep -Fq "ALLOWED_WALL_ORIGIN = 'https://offers.cpx-research.com'" v2/cpx-rewards-provider.js
          grep -Fq 'manual_opportunities_allowed' v2/rewarded-ads-ui.js
          grep -Fq 'auto_offers_enabled' v2/rewarded-ads-ui.js
          grep -Fq 'SAFE_BROWSE_VIEWS' v2/rewarded-ads-ui.js
          grep -Fq 'FSRewardedAdsProvider' v2/rewarded-ads-ui.js
          ! grep -Fq 'offers.cpx-research.com' v2/rewarded-ads-ui.js
      - name: Guard unified Rank visual hierarchy
        run: |
          set -euo pipefail
          grep -Fq 'GOLD · x1.5 rewards' v2/rank-pass-premium.css
          grep -Fq 'DIAMOND · x2 rewards' v2/rank-pass-premium.css
          ! grep -Fq 'html[data-fs-membership="gold"]' v2/rank-pass-premium.css
          ! grep -Fq 'html[data-fs-membership="diamond"]' v2/rank-pass-premium.css
          grep -Fq '@media(prefers-reduced-motion:reduce)' v2/rank-pass-premium.css
          grep -Fq 'aria-modal' v2/notifications.js
          grep -Fq "event.key === 'Escape'" v2/notifications.js
      - name: Confirm profile Rewards remains loyalty-only lazy load
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('v2/bootstrap.js').read_text()
          start=s.index('loyalty: async () => {')
          end=s.index('\n    }\n  };', start)
          block=s[start:end]
          assert './rewarded-ads.css' in block and './rewarded-ads-ui.js' in block
          core=s[s.index('async function loadCore()'):s.index('const FEATURE_LOADERS')]
          assert 'rewarded-ads' not in core
          PY
