name: R47 Premium Rank and CPX Rewards UI Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/index.html'
      - 'v2/notifications.js'
      - 'v2/notifications.css'
      - 'v2/rank-pass-premium.js'
      - 'v2/rank-pass-premium-ready.js'
      - 'v2/rank-pass-premium.css'
      - 'v2/cpx-rewards-provider.js'
      - 'v2/cpx-rewards.css'
      - 'v2/reward-opportunity-invites.js'
      - 'v2/privacy.html'
      - 'v2/terms.html'
      - 'v2/cookies.html'
      - 'scripts/test-r47-premium-rewards-ui.mjs'
      - '.github/workflows/r47-premium-rewards-ui-safety.yml'
  push:
    branches: [main]
    paths:
      - 'v2/index.html'
      - 'v2/notifications.js'
      - 'v2/notifications.css'
      - 'v2/rank-pass-premium.js'
      - 'v2/rank-pass-premium-ready.js'
      - 'v2/rank-pass-premium.css'
      - 'v2/cpx-rewards-provider.js'
      - 'v2/cpx-rewards.css'
      - 'v2/reward-opportunity-invites.js'
      - 'v2/privacy.html'
      - 'v2/terms.html'
      - 'v2/cookies.html'
      - 'scripts/test-r47-premium-rewards-ui.mjs'
      - '.github/workflows/r47-premium-rewards-ui-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate isolated module syntax
        run: |
          set -euo pipefail
          for f in \
            v2/notifications.js \
            v2/rank-pass-premium.js \
            v2/rank-pass-premium-ready.js \
            v2/cpx-rewards-provider.js \
            v2/reward-opportunity-invites.js; do
            test -s "$f"
            node --check "$f"
          done

      - name: Run R47 safety contract
        run: |
          set -euo pipefail
          node scripts/test-r47-premium-rewards-ui.mjs

      - name: Guard secrets and critical checkout contracts
        run: |
          set -euo pipefail
          ! grep -REn 'SUPABASE_SERVICE_ROLE_KEY|service_role|CPX_APP_SECURITY_HASH|GAMERHUB_API|BISA.*PASSWORD' \
            v2/notifications.js v2/rank-pass-premium.js v2/rank-pass-premium-ready.js \
            v2/cpx-rewards-provider.js v2/reward-opportunity-invites.js
          grep -Fq 'id="checkoutWallet"' v2/index.html
          grep -Fq 'id="checkoutQR"' v2/index.html
          grep -Fq 'id="qrModal"' v2/index.html
          grep -Fq 'id="topupQrModal"' v2/index.html
          grep -Fq "https://api.frenchstorebo.com" v2/index.html

      - name: Guard voluntary third-party loading
        run: |
          set -euo pipefail
          grep -Fq "ALLOWED_WALL_ORIGIN = 'https://offers.cpx-research.com'" v2/cpx-rewards-provider.js
          grep -Fq "type === 'ad'" v2/cpx-rewards-provider.js
          grep -Fq "auto_offers_enabled" v2/reward-opportunity-invites.js
          grep -Fq "onAction:" v2/reward-opportunity-invites.js
          ! grep -REn '<iframe[^>]+src="https://offers\.cpx-research\.com|src="https://offers\.cpx-research\.com' v2/index.html

      - name: Guard Rank visual hierarchy and accessibility
        run: |
          set -euo pipefail
          grep -Fq 'data-fs-membership="gold"' v2/rank-pass-premium.css
          grep -Fq 'data-fs-membership="diamond"' v2/rank-pass-premium.css
          grep -Fq '@media(prefers-reduced-motion:reduce)' v2/rank-pass-premium.css
          grep -Fq 'Keep the FRENCH STORE brand cyan/blue' v2/rank-pass-premium.css
          grep -Fq 'aria-modal' v2/notifications.js
          grep -Fq "event.key === 'Escape'" v2/notifications.js
