name: R131 Category Detail and ID Gate Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/player-verify.js'
      - 'v2/detail-layout-v2.js'
      - 'v2/detail-layout-v2.css'
      - '.github/workflows/r42-category-detail-id-gate.yml'
  push:
    branches: [main]
    paths:
      - 'v2/player-verify.js'
      - 'v2/detail-layout-v2.js'
      - 'v2/detail-layout-v2.css'
      - '.github/workflows/r42-category-detail-id-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check v2/player-verify.js
          node --check v2/detail-layout-v2.js

      - name: Player ID capture stays provider-independent and manual-safe
        run: |
          set -euo pipefail
          grep -Fq 'player-id-only-v1-20260831-r131' v2/player-verify.js
          grep -Fq "sb.from('checkout_input_requirements')" v2/player-verify.js
          grep -Fq 'enteredForGame' v2/player-verify.js
          grep -Fq 'rememberEntered' v2/player-verify.js
          grep -Fq 'syncCartInputs' v2/player-verify.js
          grep -Fq 'fs:player-input-change' v2/player-verify.js
          ! grep -Fq '/api/player-verify' v2/player-verify.js
          ! grep -Fq 'Verificar nombre' v2/player-verify.js
          ! grep -Eqi 'service_role|GAMERHUB_API|GAMERHUB_SECRET|api_secret|precio_proveedor|price_usd|create.?provider.?order|provider_purchase_jobs' v2/player-verify.js

      - name: Required identifiers own the ID-category unlock
        run: |
          set -euo pipefail
          grep -Fq 'function enteredValid(game)' v2/detail-layout-v2.js
          grep -Fq 'window.FSPlayerVerify?.enteredForGame?.(game)' v2/detail-layout-v2.js
          grep -Fq 'const ready=enteredValid(game)' v2/detail-layout-v2.js
          grep -Fq '✓ Datos completos · paquetes habilitados' v2/detail-layout-v2.js
          grep -Fq '🔒 Completa tu ID para habilitar' v2/detail-layout-v2.js
          grep -Fq 'fs:player-input-change' v2/detail-layout-v2.js
          ! grep -Fq 'needsVerification' v2/detail-layout-v2.js
          ! grep -Fq 'verifiedForGame?.(game)' v2/detail-layout-v2.js

      - name: ID lock is limited to Recargas por ID
        run: |
          set -euo pipefail
          grep -Fq "const ID_CATEGORY='Recargas por ID'" v2/detail-layout-v2.js
          grep -Fq "cat()!==ID_CATEGORY" v2/detail-layout-v2.js
          grep -Fq 'fs-id-locked' v2/detail-layout-v2.js
          grep -Fq 'Completa tu ID para habilitar' v2/detail-layout-v2.js

      - name: All four category presentations remain distinct
        run: |
          set -euo pipefail
          grep -Fq "categoryName==='Recargas por Cuenta'" v2/detail-layout-v2.js
          grep -Fq "categoryName==='Streaming'" v2/detail-layout-v2.js
          grep -Fq "categoryName==='Gift Cards'" v2/detail-layout-v2.js
          grep -Fq 'Código digital · entrega manual' v2/detail-layout-v2.js
          grep -Fq 'Los códigos Gift Card se entregan manualmente' v2/detail-layout-v2.js

      - name: No credential collection or money-moving provider code
        run: |
          set -euo pipefail
          ! grep -Eqi 'type=.password|service[_ -]?role|api[_ -]?secret|GAMERHUB_SECRET|POST /v1/orders|gamerhubCreateOrder|provider_purchase_jobs' v2/detail-layout-v2.js
          grep -Fq 'Nunca escribas aquí contraseñas' v2/detail-layout-v2.js

      - name: Detail module and stylesheet are loaded through the existing entrypoint
        run: |
          set -euo pipefail
          grep -Fq './detail-layout-v2.js?v=20260824-2' v2/player-verify.js
          grep -Fq './detail-layout-v2.css?v=20260824-2' v2/detail-layout-v2.js

      - name: Catalog observers stay child-list scoped
        run: |
          set -euo pipefail
          grep -Fq 'new MutationObserver(schedule).observe(catalog' v2/player-verify.js
          grep -Fq 'new MutationObserver(schedule).observe(catalog' v2/detail-layout-v2.js
