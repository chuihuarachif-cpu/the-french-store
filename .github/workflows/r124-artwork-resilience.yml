name: R135 Storefront Artwork Resilience

on:
  push:
    branches: [main]
    paths:
      - 'v2/index.html'
      - 'v2/bootstrap.js'
      - 'v2/config/storefront.js'
      - 'v2/features/catalog.js'
      - 'v2/r8-icons.js'
      - 'v2/r8-icons.css'
      - 'v2/assets/apps/**'
      - '.github/workflows/r124-artwork-resilience.yml'
  pull_request:
    paths:
      - 'v2/config/storefront.js'
      - 'v2/features/catalog.js'
      - 'v2/assets/apps/**'
      - '.github/workflows/r124-artwork-resilience.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artwork-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check v2/bootstrap.js
          node --check v2/config/storefront.js
          node --check v2/features/catalog.js
          node --check v2/r8-icons.js

      - name: Validate cache-busting contract
        run: |
          grep -Fq './bootstrap.js?v=20260830-r129' v2/index.html
          grep -Fq './config/storefront.js?v=20260829-r124' v2/bootstrap.js
          grep -Fq './r8-icons.css?v=20260829-r124' v2/bootstrap.js
          grep -Fq './r8-icons.js?v=20260829-r124' v2/bootstrap.js
          grep -Fq "20260902-r135" v2/config/storefront.js

      - name: Validate configured storefront artwork
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync('v2/config/storefront.js', 'utf8'), sandbox, { filename: 'storefront.js' });
          const cfg = sandbox.window.FSStorefrontConfig;
          if (!cfg || !cfg.gameIcons) throw new Error('STOREFRONT_CONFIG_GAME_ICONS_MISSING');
          const expectedCategories = ['Recargas por ID','Recargas por Cuenta','Streaming','Gift Cards'];
          if (JSON.stringify([...cfg.categories]) !== JSON.stringify(expectedCategories)) throw new Error('CATEGORY_CONTRACT_CHANGED');
          if (cfg.assetRevision !== '20260902-r135') throw new Error('ASSET_REVISION_MISMATCH');
          if (!String(cfg.gameSubtitles?.steamwallet || '').startsWith('💵')) throw new Error('STEAM_SUBTITLE_MISSING');
          if (!String(cfg.gameSubtitles?.geminipro || '').startsWith('🤖')) throw new Error('GEMINI_SUBTITLE_MISSING');

          for (const [key, src] of Object.entries(cfg.gameIcons)) {
            const value = String(src || '');
            if (value.startsWith('data:image/webp;base64,')) {
              const buf = Buffer.from(value.slice('data:image/webp;base64,'.length), 'base64');
              if (buf.length < 32 || buf.subarray(0,4).toString('ascii') !== 'RIFF' || buf.subarray(8,12).toString('ascii') !== 'WEBP') {
                throw new Error(`INVALID_INLINE_WEBP:${key}`);
              }
              continue;
            }
            const clean = value.split('?')[0].replace(/^\.\//, '');
            if (!clean.startsWith('assets/apps/')) throw new Error(`NON_LOCAL_APP_ASSET:${key}:${src}`);
            const path = `v2/${clean}`;
            if (!fs.existsSync(path)) throw new Error(`MISSING_APP_ASSET:${key}:${path}`);
            const buf = fs.readFileSync(path);
            if (buf.length < 32) throw new Error(`APP_ASSET_TOO_SMALL:${key}:${path}`);
            if (buf.subarray(0,4).toString('ascii') !== 'RIFF' || buf.subarray(8,12).toString('ascii') !== 'WEBP') {
              throw new Error(`INVALID_WEBP_HEADER:${key}:${path}`);
            }
          }
          console.log(`Validated ${Object.keys(cfg.gameIcons).length} configured storefront artwork entries.`);
          NODE

      - name: Verify fallback contract remains installed
        run: |
          grep -Fq "fsArtworkResilience" v2/r8-icons.js
          grep -Fq "handleLocalArtworkError" v2/r8-icons.js
          grep -Fq "fs-artwork-fallback--card" v2/r8-icons.css
          grep -Fq "fs-artwork-fallback--hero" v2/r8-icons.css
          grep -Fq "fs-artwork-fallback--feature" v2/r8-icons.css

      - name: Verify public local assets are served by production
        if: github.event_name == 'push'
        env:
          BASE: https://frenchstorebo.com/v2/assets/apps
        run: |
          set -euo pipefail
          for name in clash-of-clans clash-royale fortnite roblox tiktok steam; do
            out="/tmp/${name}.webp"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 2 \
              "${BASE}/${name}.webp?v=20260902-r135" -o "$out"
            python3 - "$out" "$name" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          name = sys.argv[2]
          data = path.read_bytes()
          if len(data) < 32 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit(f'PRODUCTION_INVALID_WEBP:{name}:{len(data)}')
          print(f'production asset OK: {name} ({len(data)} bytes)')
          PY
          done

      - name: Verify R135 storefront config reached production
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          check_url() {
            url="$1"
            needle="$2"
            label="$3"
            for attempt in $(seq 1 18); do
              body="$(curl --fail --location --silent --show-error --max-time 15 "${url}?deploycheck=${GITHUB_SHA}-${attempt}" || true)"
              if printf '%s' "$body" | grep -Fq "$needle"; then
                echo "production bundle OK: $label"
                return 0
              fi
              echo "waiting for production bundle: $label (attempt $attempt/18)"
              sleep 10
            done
            echo "PRODUCTION_BUNDLE_STALE:$label" >&2
            return 1
          }
          check_url "https://frenchstorebo.com/v2/" "./bootstrap.js?v=20260830-r129" "index bootstrap"
          check_url "https://frenchstorebo.com/v2/bootstrap.js" "./config/storefront.js?v=20260829-r124" "bootstrap storefront loader"
          check_url "https://frenchstorebo.com/v2/config/storefront.js" "20260902-r135" "R135 storefront config"
          check_url "https://frenchstorebo.com/v2/config/storefront.js" "GEMINI_OFFICIAL_ICON" "Gemini official icon"
          check_url "https://frenchstorebo.com/v2/r8-icons.js" "fsArtworkResilience" "artwork resilience JS"
          check_url "https://frenchstorebo.com/v2/r8-icons.css" "fs-artwork-fallback--card" "artwork resilience CSS"
