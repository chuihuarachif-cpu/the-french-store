name: Vendor Supabase R31

on:
  push:
    branches: [r31-runtime-bootstrap]
    paths:
      - '.github/workflows/vendor-supabase-r31.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact Supabase browser bundle
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm pack @supabase/supabase-js@2.112.3 >/tmp/supabase-pack-name.txt
          TARBALL="$(tail -n 1 /tmp/supabase-pack-name.txt)"
          test -s "$TARBALL"
          tar -xzf "$TARBALL"
          FILE="$(find package -type f | grep -E '/dist/umd/supabase(\.min)?\.js$' | head -n 1 || true)"
          if [ -z "$FILE" ]; then
            echo 'Supabase UMD bundle not found'
            find package -maxdepth 4 -type f | sort | sed -n '1,220p'
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/v2/vendor"
          cp "$FILE" "$GITHUB_WORKSPACE/v2/vendor/supabase-2.112.3.js"
          test -s "$GITHUB_WORKSPACE/v2/vendor/supabase-2.112.3.js"
          grep -q 'createClient' "$GITHUB_WORKSPACE/v2/vendor/supabase-2.112.3.js"

      - name: Record vendored dependency
        run: |
          cat > v2/vendor/README.md <<'EOF'
          # Vendored browser dependencies

          `supabase-2.112.3.js` is the official browser UMD bundle from `@supabase/supabase-js@2.112.3`.
          It is stored locally so the storefront startup does not depend on a third-party CDN being reachable.
          Do not replace it without pinning and testing the exact new version first.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- v2/vendor/supabase-2.112.3.js v2/vendor/README.md
          git commit -m 'R31: vendor pinned Supabase browser client' || exit 0
          git push
