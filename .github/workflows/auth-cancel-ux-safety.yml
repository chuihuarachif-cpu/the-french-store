name: Auth and Cancel UX Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/auth-ease.js'
      - 'v2/auth-google.js'
      - 'v2/legal.js'
      - 'v2/auth-confirm.js'
      - 'v2/order-cancel-ui.js'
      - 'v2/bootstrap.js'
      - '.github/workflows/auth-cancel-ux-safety.yml'
  push:
    branches: [main]
    paths:
      - 'v2/auth-ease.js'
      - 'v2/auth-google.js'
      - 'v2/legal.js'
      - 'v2/auth-confirm.js'
      - 'v2/order-cancel-ui.js'
      - 'v2/bootstrap.js'
      - '.github/workflows/auth-cancel-ux-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check v2/auth-ease.js
          node --check v2/auth-google.js
          node --check v2/legal.js
          node --check v2/auth-confirm.js
          node --check v2/order-cancel-ui.js

      - name: Check Google-only public Auth flow
        run: |
          set -euo pipefail
          grep -q "provider: 'google'" v2/auth-google.js
          grep -q "signInWithOAuth" v2/auth-google.js
          grep -q "authGoogleHost" v2/auth-ease.js
          grep -q "sanitizePublicAuth" v2/auth-google.js
          ! grep -q "sb.auth.signInWithPassword" v2/auth-ease.js
          ! grep -q "sb.auth.signUp" v2/auth-ease.js
          ! grep -q "authChoiceSignup" v2/auth-ease.js
          ! grep -q "authLegacySignupFallback" v2/auth-ease.js
          ! grep -q "Entrar con correo" v2/auth-google.js v2/auth-ease.js
          ! grep -R -E "service_role|SUPABASE_SERVICE|SUPABASE_SERVICE_ROLE|client_secret|provider_token" v2/auth-ease.js v2/auth-google.js v2/legal.js v2/auth-confirm.js

      - name: No password capability anywhere in the public storefront
        run: |
          set -euo pipefail
          # R160: este paso se llamaba "Historical recovery compatibility
          # remains isolated" y EXIGÍA que el código de recuperación existiera,
          # tolerándolo como compatibilidad de transición. La transición
          # terminó: el ingreso público es solo Google, así que ahora se exige
          # su AUSENCIA. Es una garantía estrictamente más fuerte que la que
          # sustituye, no una relajación.
          # Se excluye v2/app.js: es el monolito histórico que index.html NO
          # carga (0 referencias) y que AGENTS.md manda conservar como
          # referencia de rollback hasta una revisión de limpieza aprobada.
          # Conserva llamadas de contraseña muertas; se sirve pero no se
          # ejecuta. Queda anotado como deuda, no como vía activa.
          ! grep -rq --exclude=app.js "sb.auth.resetPasswordForEmail" v2/
          ! grep -rq --exclude=app.js "sb.auth.updateUser({ password" v2/
          ! grep -rq --exclude=app.js "sb.auth.verifyOtp" v2/
          ! grep -rq --exclude=app.js "sb.auth.signUp(" v2/
          ! grep -rq --exclude=app.js "sb.auth.signInWithPassword" v2/
          ! grep -rEq --exclude=app.js '<input[^>]*type="password"' v2/
          # app.js debe seguir sin cargarse desde el shell público.
          ! grep -q 'app\.js' v2/index.html
          grep -q "specialAuthFlow" v2/auth-ease.js
          grep -q "specialAuthFlow" v2/auth-google.js
          echo 'Sin creación de cuenta, sin restablecimiento y sin definición de contraseña en la tienda pública.'

      - name: Check auth module ownership and load order
        run: |
          set -euo pipefail
          grep -q "./auth-ease.js" v2/bootstrap.js
          grep -q "./legal.js" v2/bootstrap.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('v2/bootstrap.js').read_text()
          assert s.index('./features/auth.js') < s.index('./auth-ease.js') < s.index('./legal.js') < s.index('./auth-confirm.js')
          a=Path('v2/auth-ease.js').read_text()
          assert 'showChoice' in a
          assert 'hideLegacyPublicAuth' in a
          PY

      - name: Check fail-closed cancellation messages
        run: |
          set -euo pipefail
          grep -q "/bisa-sip/order-cancel" v2/order-cancel-ui.js
          grep -q "PAYMENT_ALREADY_CONFIRMED" v2/order-cancel-ui.js
          grep -q "BANK_AUTH_UNAVAILABLE" v2/order-cancel-ui.js
          grep -q "BANK_STATUS_UNAVAILABLE" v2/order-cancel-ui.js
          grep -q "BANK_QR_DISABLE_FAILED" v2/order-cancel-ui.js
          grep -q "CANCELLATION_TEMPORARILY_UNAVAILABLE" v2/order-cancel-ui.js
          grep -q "El pedido sigue sin cambios" v2/order-cancel-ui.js
          ! grep -R -E "service_role|SUPABASE_SERVICE|BISA_SIP_PROD" v2/order-cancel-ui.js
