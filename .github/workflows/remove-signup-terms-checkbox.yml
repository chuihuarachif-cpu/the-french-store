name: Remove signup terms checkbox

on:
  push:
    paths:
      - '.github/workflows/remove-signup-terms-checkbox.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simplify signup form
        shell: python
        run: |
          from pathlib import Path

          html_path = Path('v2/index.html')
          auth_path = Path('v2/auth-ease.js')

          html = html_path.read_text(encoding='utf-8')
          auth = auth_path.read_text(encoding='utf-8')

          checkbox = '<label class="legal-check"><input id="legalAccept" type="checkbox"><span>Para crear una cuenta, confirmo que leí los <a href="./terms.html" target="_blank" rel="noopener noreferrer">Términos</a> y la <a href="./privacy.html" target="_blank" rel="noopener noreferrer">Política de Privacidad</a>.</span></label>'
          if checkbox in html:
              html = html.replace(checkbox, '', 1)
          elif 'id="legalAccept"' in html:
              raise SystemExit('Signup legal checkbox has unexpected markup')

          old_heading = "setHeading('Crear cuenta', 'Escribe tu correo, crea una contraseña y acepta los términos.');"
          new_heading = "setHeading('Crear cuenta', 'Escribe tu correo y crea una contraseña.');"
          if old_heading in auth:
              auth = auth.replace(old_heading, new_heading, 1)
          elif new_heading not in auth:
              raise SystemExit('Signup heading marker not found')

          html_path.write_text(html, encoding='utf-8')
          auth_path.write_text(auth, encoding='utf-8')

      - name: Test signup flow
        run: |
          node --check v2/auth-ease.js
          node --check v2/legal.js
          node --check v2/auth-confirm.js
          python - <<'PY'
          from pathlib import Path
          html = Path('v2/index.html').read_text(encoding='utf-8')
          auth = Path('v2/auth-ease.js').read_text(encoding='utf-8')
          assert 'id="legalAccept"' not in html
          assert "Escribe tu correo y crea una contraseña." in auth
          assert 'id="purchaseLegalAccept"' in html
          assert 'terms.html' in html and 'privacy.html' in html and 'refunds.html' in html
          print('Signup simplification checks passed')
          PY

      - name: Commit signup simplification
        run: |
          if git diff --quiet -- v2/index.html v2/auth-ease.js; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/index.html v2/auth-ease.js
          git commit -m "Simplify account signup"
          git push
