name: R94 Assemble Intro Media

on:
  push:
    branches: [r94-cinematic-intro]
    paths:
      - '.r94-media/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R94
        uses: actions/checkout@v4
        with:
          ref: r94-cinematic-intro

      - name: Assemble and validate isolated intro audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2/intro
          cat .r94-media/audio/part-*.b64 > /tmp/french-store-theme.b64
          base64 --decode /tmp/french-store-theme.b64 > v2/intro/french-store-theme.mp3
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          audio = Path('v2/intro/french-store-theme.mp3')
          assert audio.stat().st_size == 24606, audio.stat().st_size
          assert hashlib.sha256(audio.read_bytes()).hexdigest() == '1c6be8c84c14900fb67ba3155a656167708941bcd8759d5aa59208cda0b4d06f'
          assert audio.read_bytes()[:3] == b'ID3'
          print('R94 intro audio validation OK')
          PY

      - name: Wire intro with only two isolated includes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('v2/index.html')
          html = path.read_text(encoding='utf-8')

          css = '  <link rel="stylesheet" href="./intro/french-intro.css?v=20260826-r94b">\n'
          js = '  <script src="./intro/french-intro.js?v=20260826-r94b" defer></script>\n'

          if './intro/french-intro.css' not in html:
              anchor = '  <link rel="stylesheet" href="./cpx-rewards.css?v=20260825-r47">\n'
              if anchor not in html:
                  raise SystemExit('CSS anchor not found; refusing broad index edit')
              html = html.replace(anchor, anchor + css, 1)

          if './intro/french-intro.js' not in html:
              anchor = '  <script src="./notifications.js?v=20260825-r47" defer></script>\n'
              if anchor not in html:
                  raise SystemExit('JS anchor not found; refusing broad index edit')
              html = html.replace(anchor, js + anchor, 1)

          path.write_text(html, encoding='utf-8')

          final = path.read_text(encoding='utf-8')
          assert final.count('./intro/french-intro.css') == 1
          assert final.count('./intro/french-intro.js') == 1
          print('R94 index wiring OK')
          PY

      - name: Validate isolated intro references
        shell: bash
        run: |
          set -euo pipefail
          node --check v2/intro/french-intro.js
          test -s v2/intro/french-intro.css
          grep -Fq "./assets/brand/icon-512.png" v2/intro/french-intro.js
          grep -Fq "./intro/french-store-theme.mp3" v2/intro/french-intro.js
          grep -Fq "./intro/french-intro.css" v2/index.html
          grep -Fq "./intro/french-intro.js" v2/index.html

      - name: Remove transport chunks and self-clean workflow
        shell: bash
        run: |
          rm -rf .r94-media
          rm -f .github/workflows/r94-media-assemble.yml

      - name: Commit finished isolated intro
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R94: finalizar intro cinematográfica aislada con música'
          git push origin HEAD:r94-cinematic-intro
