name: R94 Assemble Intro Media

on:
  push:
    branches: [r94-cinematic-intro]
    paths:
      - '.r94-media/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R94
        uses: actions/checkout@v4
        with:
          ref: r94-cinematic-intro

      - name: Assemble and validate isolated intro audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v2/intro
          cat .r94-media/audio/part-*.b64 > /tmp/french-store-theme.b64
          base64 --decode /tmp/french-store-theme.b64 > v2/intro/french-store-theme.mp3
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          audio = Path('v2/intro/french-store-theme.mp3')
          assert audio.stat().st_size == 24606, audio.stat().st_size
          assert hashlib.sha256(audio.read_bytes()).hexdigest() == '1c6be8c84c14900fb67ba3155a656167708941bcd8759d5aa59208cda0b4d06f'
          assert audio.read_bytes()[:3] == b'ID3'
          print('R94 intro audio validation OK')
          PY

      - name: Remove transport chunks and self-clean workflow
        shell: bash
        run: |
          rm -rf .r94-media
          rm -f .github/workflows/r94-media-assemble.yml

      - name: Commit assembled binary asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R94: ensamblar música optimizada de intro'
          git push origin HEAD:r94-cinematic-intro
