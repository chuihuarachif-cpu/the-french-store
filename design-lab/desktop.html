<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#050b12">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';">
  <title>French Store · Lab · Vista PC</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#03070c;color:#edfaff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow:auto}
    .desktop-preview-shell{min-width:1440px;min-height:100vh}
    #labDesktopFrame{display:block;width:100%;min-width:1440px;height:100vh;border:0;background:#050b12}
    .preview-error{display:none;max-width:760px;margin:64px auto;padding:24px;border:1px solid rgba(98,231,255,.25);border-radius:20px;background:#09131f;line-height:1.6}
    .preview-error.show{display:block}
  </style>
</head>
<body>
  <main class="desktop-preview-shell" aria-label="French Store Design Lab · vista de computadora">
    <iframe id="labDesktopFrame" src="./index.html" title="French Store Design Lab - Vista PC"></iframe>
    <div class="preview-error" id="previewError">
      No se pudo preparar la vista de escritorio. Abre <b>design-lab/index.html</b> dentro de la rama <b>design-lab</b>.
    </div>
  </main>
  <script>
    (() => {
      const frame = document.getElementById('labDesktopFrame');
      const error = document.getElementById('previewError');

      function prepareDesktopView(){
        try{
          const doc = frame.contentDocument;
          if(!doc) throw new Error('Documento no disponible');

          doc.documentElement.dataset.device = 'desktop';
          doc.documentElement.style.setProperty('--device-width','1440px');
          doc.documentElement.style.setProperty('--device-height','900px');
          doc.documentElement.style.setProperty('--device-scale','1');

          const style = doc.createElement('style');
          style.setAttribute('data-desktop-preview-override','');
          style.textContent = `
            html,body{min-width:1440px!important;background:#050b12!important}
            body{overflow-x:auto!important}
            .lab-shell{display:block!important;min-height:100vh!important}
            .lab-panel,.preview-toolbar{display:none!important}
            .preview-stage{padding:0!important;min-height:100vh!important}
            .device-viewport{display:block!important;width:1440px!important;height:auto!important;overflow:visible!important;margin:0 auto!important}
            .device-frame{width:1440px!important;flex:0 0 1440px!important;max-width:none!important;margin:0!important;transform:none!important}
            .store-app{min-height:900px!important;border-radius:0!important;border:0!important;box-shadow:none!important}
            #roleBanner{display:none!important}
          `;
          doc.head.appendChild(style);

          const resize = () => {
            try{
              const height = Math.max(900, doc.documentElement.scrollHeight, doc.body.scrollHeight);
              frame.style.height = height + 'px';
            }catch(_){}
          };

          resize();
          const observer = new MutationObserver(() => requestAnimationFrame(resize));
          observer.observe(doc.body,{subtree:true,childList:true,attributes:true});
          window.addEventListener('resize',resize,{passive:true});

          error.classList.remove('show');
        }catch(err){
          error.classList.add('show');
        }
      }

      frame.addEventListener('load',prepareDesktopView);
    })();
  </script>
</body>
</html>
