<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>💎 FRENCH STORE 💎</title>
    
    <!-- Fuentes futuristas y modernas -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #050b14; /* Fondo oscuro estilo gamer */
            color: #f8fafc; 
            margin: 0; 
            padding: 0; 
        }
        
        /* --- ESTILOS DEL ENCABEZADO TIPO NEÓN --- */
        header { 
            text-align: center; 
            padding: 40px 20px; 
            background: radial-gradient(circle at center, #112240 0%, #050b14 100%);
            border-bottom: 2px solid #0ff;
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.1);
        }
        .subtitle { 
            color: #0ff; 
            font-weight: 600; 
            letter-spacing: 2px; 
            font-size: 12px; 
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .neon-title { 
            font-family: 'Orbitron', sans-serif; 
            font-size: 38px; 
            color: #fff; 
            margin: 0; 
            /* Efecto Neón y animación */
            text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff; 
            animation: palpitar 2s infinite alternate;
        }
        .description { 
            color: #94a3b8; 
            font-size: 14px; 
            max-width: 600px; 
            margin: 15px auto; 
            line-height: 1.5;
        }
        .badges { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            flex-wrap: wrap; 
            margin-top: 20px; 
        }
        .badge { 
            border: 1px solid #0ff; 
            color: #0ff; 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-size: 12px; 
            background: rgba(0, 255, 255, 0.05); 
        }

        /* Animación del título */
        @keyframes palpitar {
            0% { text-shadow: 0 0 5px #0ff, 0 0 10px #0ff; }
            100% { text-shadow: 0 0 5px #0ff, 0 0 20px #0ff, 0 0 35px #0ff; }
        }

        /* --- ESTILOS DEL CONTENEDOR Y PESTAÑAS --- */
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .tabs { 
            display: flex; 
            justify-content: space-between; 
            background-color: #0f172a; 
            padding: 10px; 
            border-radius: 10px; 
            margin-bottom: 25px; 
            border: 1px solid #1e293b;
        }
        .tab-button { 
            flex: 1; 
            background: transparent; 
            color: #64748b; 
            border: none; 
            padding: 10px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            border-bottom: 2px solid transparent; 
            transition: all 0.3s ease;
        }
        .tab-button.active { 
            color: #0ff; 
            border-bottom: 2px solid #0ff; 
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }
        
        /* --- ESTILOS DE LOS MENÚS DESPLEGABLES --- */
        details { 
            background-color: #0f172a; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            border: 1px solid #1e293b;
            transition: all 0.3s ease; 
            overflow: hidden; 
        }
        details:hover {
            border-color: #0ff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
            transform: translateY(-2px); /* Animación de flotar */
        }
        summary { 
            padding: 18px; 
            font-size: 16px; 
            font-weight: 600; 
            color: #f1f5f9; 
            cursor: pointer; 
            list-style: none; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background-color: #1e293b; 
        }
        summary::-webkit-details-marker { display: none; }
        summary:after { content: "▼"; color: #0ff; font-size: 12px; }
        details[open] summary:after { content: "▲"; }
        
        /* --- ESTILOS DE LOS PRODUCTOS --- */
        .product-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 20px; 
            border-top: 1px solid #1e293b; 
        }
        .product-item:hover { background-color: rgba(30, 41, 59, 0.5); }
        .product-name { font-size: 15px; color: #cbd5e1; }
        .product-price-buy { display: flex; align-items: center; gap: 15px; }
        .price { font-size: 18px; font-weight: bold; color: #10b981; }
        
        .btn-comprar { 
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%); 
            color: #000; 
            text-decoration: none; 
            padding: 8px 18px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 14px; 
            transition: all 0.2s ease;
        }
        .btn-comprar:hover { 
            transform: scale(1.05); 
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5); 
        }
    </style>
</head>
<body>

    <header>
        <div class="subtitle">RECARGAS AL INSTANTE</div>
        <h1 class="neon-title">💎 FRENCH STORE 💎</h1>
        <p class="description">Diamantes, monedas, pases y plataformas de streaming. Elige tu juego, selecciona tu paquete y recibe tu recarga en minutos.</p>
        <div class="badges">
            <span class="badge">⏱️ Entrega rápida</span>
            <span class="badge">🛡️ Pago seguro</span>
            <span class="badge">🎮 +25 Juegos</span>
        </div>
    </header>

    <div class="container">
        <div class="tabs">
            <button class="tab-button active" onclick="filtrarCategoria('Recargas por ID', this)">Recargas por ID</button>
            <button class="tab-button" onclick="filtrarCategoria('Recargas por Cuenta', this)">Recargas por Cuenta</button>
            <button class="tab-button" onclick="filtrarCategoria('Streaming', this)">Streaming</button>
        </div>

        <div id="lista-productos">
            <p style="text-align:center; color:#0ff; font-family:'Orbitron', sans-serif;">Cargando catálogo...</p>
        </div>
    </div>

    <script>
        // --- 1. AQUÍ VAN TUS DATOS DE SUPABASE ---
        const SUPABASE_URL = 'https://jivaaripugjdpxjvjnsu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppdmFhcmlwdWdqZHB4anZqbnN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NDY3MzIsImV4cCI6MjEwMTIyMjczMn0.N60Xb1PqqPo12HdKEzPc4qCp1aFvVzwZz4VG04q_Es4';
        
        // --- 2. AQUÍ VA TU NÚMERO DE WHATSAPP ---
        const NUMERO_WHATSAPP = '59177057379'; 

        let inventarioGlobal = [];

        async function cargarProductos() {
            try {
                // Solo trae productos PUBLICADOS.
                // Además ordena juego A-Z y precio de menor a mayor.
                const url = new URL(`${SUPABASE_URL}/rest/v1/productos`);
                url.searchParams.set('select', '*');
                url.searchParams.set('activo', 'eq.true');
                url.searchParams.set('order', 'juego.asc,precio.asc,paquete.asc');

                const respuesta = await fetch(url.toString(), {
                    method: 'GET',
                    cache: 'no-store',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Accept': 'application/json'
                    }
                });

                if (!respuesta.ok) {
                    throw new Error(`Supabase respondió ${respuesta.status}`);
                }

                const datos = await respuesta.json();

                // Segunda protección:
                // aunque por error llegara una fila inactiva, no se muestra.
                inventarioGlobal = Array.isArray(datos)
                    ? datos.filter(item => item.activo === true)
                    : [];

                filtrarCategoria(
                    'Recargas por ID',
                    document.querySelector('.tab-button.active')
                );

            } catch (error) {
                console.error('Error cargando productos:', error);
                document.getElementById('lista-productos').innerHTML =
                    '<p style="color:red; text-align:center;">Error al conectar con la base de datos.</p>';
            }
        }

        function filtrarCategoria(categoria, botonElement) {
            document.querySelectorAll('.tab-button').forEach(
                btn => btn.classList.remove('active')
            );

            if (botonElement) {
                botonElement.classList.add('active');
            }

            const contenedor = document.getElementById('lista-productos');
            contenedor.innerHTML = '';

            const productosFiltrados = inventarioGlobal
                .filter(item =>
                    item.activo === true &&
                    item.categoria === categoria
                )
                .sort((a, b) => {
                    const juegoA = String(a.juego || '');
                    const juegoB = String(b.juego || '');

                    const porJuego = juegoA.localeCompare(
                        juegoB,
                        'es',
                        { sensitivity: 'base' }
                    );

                    if (porJuego !== 0) return porJuego;

                    const precioA = Number(a.precio) || 0;
                    const precioB = Number(b.precio) || 0;

                    if (precioA !== precioB) return precioA - precioB;

                    return String(a.paquete || '').localeCompare(
                        String(b.paquete || ''),
                        'es',
                        { sensitivity: 'base' }
                    );
                });

            if (productosFiltrados.length === 0) {
                contenedor.innerHTML =
                    '<p style="text-align:center; color:#94a3b8; margin-top:30px;">No hay productos en esta sección por ahora.</p>';
                return;
            }

            const juegosAgrupados = {};

            productosFiltrados.forEach(item => {
                const nombreJuego = item.juego || 'Sin categoría';

                if (!juegosAgrupados[nombreJuego]) {
                    juegosAgrupados[nombreJuego] = [];
                }

                juegosAgrupados[nombreJuego].push(item);
            });

            const nombresJuegos = Object.keys(juegosAgrupados).sort(
                (a, b) => a.localeCompare(
                    b,
                    'es',
                    { sensitivity: 'base' }
                )
            );

            nombresJuegos.forEach(juego => {
                const paquetes = juegosAgrupados[juego].sort((a, b) => {
                    const precioA = Number(a.precio) || 0;
                    const precioB = Number(b.precio) || 0;

                    if (precioA !== precioB) return precioA - precioB;

                    return String(a.paquete || '').localeCompare(
                        String(b.paquete || ''),
                        'es',
                        { sensitivity: 'base' }
                    );
                });

                let htmlPaquetes = '';

                paquetes.forEach(p => {
                    const mensaje = encodeURIComponent(
                        `Hola, quisiera comprar el paquete de ${p.paquete} para ${juego} que cuesta ${p.precio} Bs.`
                    );

                    const linkWpp =
                        `https://wa.me/${NUMERO_WHATSAPP}?text=${mensaje}`;

                    htmlPaquetes += `
                        <div class="product-item">
                            <div class="product-name">${p.paquete}</div>
                            <div class="product-price-buy">
                                <span class="price">${p.precio} Bs</span>
                                <a href="${linkWpp}" target="_blank" rel="noopener noreferrer" class="btn-comprar">Comprar</a>
                            </div>
                        </div>
                    `;
                });

                contenedor.innerHTML += `
                    <details>
                        <summary>${juego}</summary>
                        ${htmlPaquetes}
                    </details>
                `;
            });
        }

        cargarProductos();
    </script>
</body>
</html>
