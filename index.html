<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 FRENCH STORE 💎</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .tabs { display: flex; justify-content: space-between; background-color: #1e293b; padding: 10px; border-radius: 10px; margin-bottom: 20px; overflow-x: auto; }
        .tab-button { flex: 1; background: transparent; color: #94a3b8; border: none; padding: 10px; font-size: 16px; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; min-width: 120px; }
        .tab-button.active { color: #38bdf8; border-bottom: 3px solid #38bdf8; }
        .product-card { background-color: #1e293b; border-radius: 10px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .product-info h3 { margin: 0 0 5px 0; font-size: 18px; color: #f1f5f9; }
        .product-price { font-size: 20px; font-weight: bold; color: #10b981; }
    </style>
</head>
<body>

    <header>💎 FRENCH STORE 💎</header>

    <div class="container">
        <div class="tabs">
            <button class="tab-button active">Recargas por ID</button>
            <button class="tab-button">Recargas por Cuenta</button>
            <button class="tab-button">Streaming</button>
        </div>

        <div id="lista-productos">
            <div class="product-card">
                <div class="product-info">
                    <h3 style="color: #94a3b8;">Cargando inventario...</h3>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- AQUÍ PONES TUS DATOS DE SUPABASE ---
        const SUPABASE_URL = 'PEGAR_AQUI_TU_URL';
        const SUPABASE_KEY = 'PEGAR_AQUI_TU_API_KEY';
        
        // --- AQUÍ PONES EL NOMBRE EXACTO DE TU TABLA ---
        const NOMBRE_DE_TABLA = 'productos'; 

        async function cargarProductos() {
            try {
                const respuesta = await fetch(`${SUPABASE_URL}/rest/v1/${NOMBRE_DE_TABLA}?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                const datos = await respuesta.json();
                const contenedor = document.getElementById('lista-productos');
                contenedor.innerHTML = ''; 

                if (datos.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center; color:#94a3b8;">Inventario vacío por ahora.</p>';
                    return;
                }

                datos.forEach(item => {
                    contenedor.innerHTML += `
                        <div class="product-card">
                            <div class="product-info">
                                <h3>${item.nombre}</h3>
                            </div>
                            <div class="product-price">${item.precio} Bs</div>
                        </div>
                    `;
                });
            } catch (error) {
                document.getElementById('lista-productos').innerHTML = '<p style="color:red; text-align:center;">Error al conectar con la base de datos.</p>';
            }
        }

        cargarProductos();
    </script>
</body>
</html>
